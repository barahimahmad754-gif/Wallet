<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أبطال الحروف">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>أبطال الحروف</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@700&family=Amiri+Quran&display=swap">
<style>
/* Layout: one-screen voxel game shell. Sticky HUD on top, scrolling screen body, full-bleed play areas. One committed daylight look. */
:root{
  --sky1:#4FA8EE; --sky2:#C4E9FF; --grass:#4FAE32; --grass-d:#2F7A1E; --dirt:#8A5A33; --dirt-d:#5E3B1F;
  --stone:#7A828C; --stone-d:#454B54; --gold:#FFC93C; --gold-d:#C98A12; --gem:#38E0D0; --gem-d:#167A70;
  --ink:#1B2418; --paper:#F3F7EE; --paper-2:#DDE7D3; --red:#E5484D; --blue:#2E86DE; --violet:#8B6CF0;
  --night:#1E2547; --night-2:#3B3F7A;
  --f-display:'Lalezar','Baloo Bhaijaan 2',Tahoma,sans-serif;
  --f-body:'Baloo Bhaijaan 2',Tahoma,'Segoe UI',sans-serif;
  --f-letter:'Noto Naskh Arabic','Amiri',Tahoma,serif;
  --f-quran:'Amiri Quran','Amiri','Noto Naskh Arabic',serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky1),var(--sky2) 78%);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body::after{content:"";position:fixed;inset:auto 0 0 0;height:22px;background:linear-gradient(var(--grass) 0 8px,var(--grass-d) 8px 11px,var(--dirt) 11px);z-index:0;pointer-events:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cloud{position:fixed;height:22px;background:#fff;opacity:.85;z-index:0;pointer-events:none;box-shadow:22px -12px 0 #fff,44px 0 0 #fff;width:44px;animation:drift 80s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(120vw)}}

#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;z-index:1}
.top{display:flex;align-items:center;gap:8px;padding-block:10px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app.ingame .top{display:none}
.me{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.me .av{width:40px;height:44px;background:var(--paper);border:3px solid var(--ink);border-radius:6px;padding:3px;flex:none}
.me .av svg{width:100%;height:100%;display:block}
.me .info{min-width:0;flex:1}
.me .nm{font-family:var(--f-display);font-size:17px;line-height:1.1;color:#fff;text-shadow:0 2px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{display:flex;align-items:center;gap:6px}
.lvl b{font-family:var(--f-display);font-weight:400;background:var(--violet);color:#fff;border:2px solid var(--ink);border-radius:4px;padding:0 6px;font-size:14px;white-space:nowrap}
.xpbar{flex:1;height:10px;background:rgba(27,36,24,.35);border:2px solid var(--ink);border-radius:3px;overflow:hidden;max-width:110px}
.xpbar i{display:block;height:100%;background:var(--gem);transition:width .6s}
.cur{display:flex;align-items:center;gap:4px;background:rgba(27,36,24,.75);color:#fff;border:2px solid var(--ink);border-radius:20px;padding:2px 10px 2px 6px;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;flex:none}
.ico{width:20px;height:20px;display:inline-block;vertical-align:middle;flex:none}
.gear{width:40px;height:40px;border-radius:8px;border:3px solid var(--ink);background:var(--stone);color:#fff;font-size:20px;flex:none;position:relative;overflow:hidden}
.gear::after{content:"";position:absolute;inset:auto 0 0 0;height:0;background:rgba(255,201,60,.6)}
.gear.holding::after{height:100%;transition:height 1.4s linear}

.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:6px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-overflow-scrolling:touch}
.screen.full{overflow:hidden;padding-bottom:28px;padding-top:max(10px,env(safe-area-inset-top,0px))}

.btn{--c:var(--grass);font-family:var(--f-display);font-weight:400;font-size:22px;color:#fff;background:var(--c);border:3px solid var(--ink);border-radius:6px;padding:8px 18px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.22),inset 0 4px 0 rgba(255,255,255,.28),0 4px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.28),0 1px 0 var(--ink)}
.btn.sm{font-size:17px;padding:4px 12px}
.btn.big{font-size:28px;padding:12px 26px}
.btn.gold{--c:var(--gold);color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.4)}
.btn.red{--c:var(--red)} .btn.blue{--c:var(--blue)} .btn.stone{--c:var(--stone)} .btn.violet{--c:var(--violet)} .btn.teal{--c:var(--gem-d)}
.btn[disabled]{filter:grayscale(.8);opacity:.6}

.hdr{display:flex;align-items:center;gap:10px;margin-block:6px 12px}
.hdr h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:28px;color:#fff;text-shadow:0 3px 0 var(--ink);min-width:0}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:8px;box-shadow:0 5px 0 var(--ink);padding:14px}

/* HOME */
.stage{position:relative;height:200px;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:linear-gradient(180deg,#7CC4F7,#BFE6FF 60%,var(--grass) 60% 66%,var(--dirt) 66%);box-shadow:0 5px 0 var(--ink);width:100%;padding:0;display:block}
.stage .hero{position:absolute;bottom:58px;right:28%;width:66px}
.stage .hero svg{width:100%;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.stage .gun{position:absolute;bottom:80px;right:6%;width:90px;transform:rotate(-8deg)}
.stage .car{position:absolute;bottom:40px;left:10%;width:62px;transform:rotate(90deg)}
.stage .pet{position:absolute;bottom:60px;right:50%;font-size:40px;line-height:1}
.stage .tag{position:absolute;top:8px;right:10px;font-family:var(--f-display);font-size:16px;background:rgba(27,36,24,.75);color:#fff;border-radius:4px;padding:0 8px}
.stage .bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.daily{display:flex;align-items:center;gap:12px;margin-top:14px;width:100%;text-align:right;--c:var(--violet)}
.daily .chest{font-size:38px;animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-12deg)}80%{transform:rotate(12deg)}90%{transform:rotate(-6deg)}}
.daily small{display:block;font-family:var(--f-body);font-size:14px;font-weight:700;opacity:.95}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.wcard{--c:var(--grass);display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px 12px}
.wcard .glyph{font-family:var(--f-letter);font-size:50px;line-height:1.2}
.wcard .glyph.q{font-family:var(--f-quran);font-size:38px;line-height:1.6}
.wcard .t{font-size:23px}
.wcard .p{font-family:var(--f-body);font-weight:800;font-size:14px;background:rgba(0,0,0,.25);border-radius:10px;padding:0 10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.row3 .btn{display:flex;flex-direction:column;align-items:center;gap:0;font-size:18px;padding:8px 4px}
.row3 .btn span:first-child{font-size:28px;line-height:1.2}
.streak{margin-top:14px;display:flex;gap:6px;justify-content:center}
.streak span{width:34px;height:34px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:6px;background:var(--paper-2);font-family:var(--f-display);font-size:15px}
.streak span.on{background:var(--gold)}

/* MAPS */
.world{margin-bottom:18px;border:3px solid var(--ink);border-radius:10px;overflow:hidden;box-shadow:0 5px 0 var(--ink);background:var(--paper)}
.world h3{margin:0;padding:6px 12px;background:var(--wc);color:#fff;font-family:var(--f-display);font-weight:400;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.4);border-bottom:3px solid var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px}
.world h3 small{font-size:14px;background:rgba(0,0,0,.25);border-radius:4px;padding:0 6px}
.nodes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px 12px 16px}
.node{position:relative;aspect-ratio:1;max-width:100%;border:3px solid var(--ink);border-radius:6px;background:var(--wc);color:#fff;font-family:var(--f-letter);font-size:clamp(26px,8vw,40px);line-height:1;box-shadow:inset 0 -6px 0 rgba(0,0,0,.22),inset 0 4px 0 rgba(255,255,255,.3),0 4px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.35);display:grid;place-items:center;padding:0}
.node.boss{font-size:clamp(22px,7vw,32px);background:var(--stone-d)}
.node.locked{filter:grayscale(1) brightness(.85);opacity:.55}
.node.locked::after{content:"🔒";position:absolute;font-size:16px;bottom:-6px;left:-6px;text-shadow:none}
.node.next{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.node .st{position:absolute;bottom:-12px;left:0;right:0;font-size:12px;letter-spacing:-1px;font-family:var(--f-body);text-shadow:0 1px 0 var(--ink)}
.stars{color:var(--gold)} .stars .e{color:#B9C0B2}
.newgame{font-family:var(--f-body);font-weight:800;font-size:13px;color:var(--ink);background:var(--gold);border:2px solid var(--ink);border-radius:4px;padding:0 6px;text-shadow:none}
.sura{margin-bottom:14px;border:3px solid var(--ink);border-radius:10px;background:var(--paper);box-shadow:0 5px 0 var(--ink);overflow:hidden}
.sura.locked{filter:grayscale(1);opacity:.55}
.sura .sh{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--grass-d);color:#fff;border-bottom:3px solid var(--ink)}
.sura .sh .sn{font-family:var(--f-quran);font-size:24px;line-height:1.7;flex:1;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.sura .sh .num{width:36px;height:36px;flex:none;display:grid;place-items:center;background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:6px;font-family:var(--f-display);font-size:17px}
.sura .sh .tier{font-family:var(--f-body);font-weight:800;font-size:12px;background:rgba(0,0,0,.3);border-radius:4px;padding:0 6px;white-space:nowrap}
.parts{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px 16px}
.part{--wc:var(--grass);position:relative;min-width:64px;font-family:var(--f-display);font-size:16px;color:#fff;background:var(--wc);border:3px solid var(--ink);border-radius:6px;padding:6px 10px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 4px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.part.locked{filter:grayscale(1);opacity:.6}
.part.next{animation:pulse 1s ease-in-out infinite}
.part .st{display:block;font-size:12px;font-family:var(--f-body);letter-spacing:-1px}

/* SHOP / COLLECTION */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.tab{flex:none;font-family:var(--f-display);font-size:17px;padding:6px 12px;border:3px solid var(--ink);border-radius:6px;background:var(--paper-2);color:var(--ink)}
.tab.on{background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:8px;box-shadow:0 4px 0 var(--ink);padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;min-width:0}
.card .pic{height:84px;width:100%;display:grid;place-items:center;background:linear-gradient(#CFE9FF,#E9F5FF);border:2px solid var(--ink);border-radius:6px;font-size:54px;line-height:1}
.card .pic svg{max-height:70px;max-width:80%}
.card .pic.car svg{transform:rotate(90deg);max-height:90px}
.card .nm{font-family:var(--f-display);font-size:18px;text-align:center}
.card .perk{font-size:13px;font-weight:800;text-align:center;color:var(--gem-d);line-height:1.3;min-height:34px}
.card .btn{width:100%;font-size:17px;padding:4px 8px;display:flex;justify-content:center;align-items:center;gap:4px}
.rar{position:absolute;top:-8px;left:-6px;font-family:var(--f-display);font-size:13px;color:#fff;border:2px solid var(--ink);border-radius:4px;padding:0 6px;background:var(--blue)}
.rar.epic{background:var(--violet)} .rar.legend{background:var(--gold);color:var(--ink)}
.upg{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.upg .ic{font-size:34px;width:56px;height:56px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:8px;background:var(--paper-2);flex:none}
.upg .mid{flex:1;min-width:0}
.upg .mid b{font-family:var(--f-display);font-weight:400;font-size:19px;display:block}
.upg .pips{display:flex;gap:4px;margin-top:4px}
.upg .pips i{width:18px;height:12px;border:2px solid var(--ink);background:var(--paper-2)}
.upg .pips i.on{background:var(--gem)}
.boxzone{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 10px}
.mbox{font-size:96px;line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3));animation:wiggle 1.6s ease-in-out infinite}
.odds{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.odds span{font-size:13px;font-weight:800;background:var(--paper-2);border:2px solid var(--ink);border-radius:4px;padding:0 8px}
.muted{font-size:14px;color:var(--stone-d);font-weight:700}
.album{margin-bottom:14px}
.album h3{margin:0 0 8px;font-family:var(--f-display);font-weight:400;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.stk{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.stk span{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(22px,7vw,34px);border:3px solid var(--ink);border-radius:6px;background:#fff;position:relative}
.stk span.no{background:var(--paper-2);filter:grayscale(1) brightness(.4);opacity:.35}
.stk span b{position:absolute;bottom:-6px;left:-4px;font-size:11px;background:var(--gold);border:2px solid var(--ink);border-radius:4px;padding:0 3px;line-height:1.2;font-family:var(--f-body)}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.inv .card .pic{font-size:46px}

/* GAME */
.game{display:flex;flex-direction:column;height:100%;gap:8px}
.ghud{display:flex;align-items:center;gap:8px}
.hearts{font-size:18px;letter-spacing:-2px;flex:none;line-height:1.1;max-width:70px;text-align:center}
.prompt{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--paper);border:3px solid var(--ink);border-radius:8px;box-shadow:0 4px 0 var(--ink);padding:2px 10px;min-width:0}
.prompt .plab{font-family:var(--f-display);font-size:17px;white-space:nowrap}
.prompt .pl{font-family:var(--f-letter);font-size:40px;line-height:1.25;color:var(--red)}
.prompt .spk{font-size:22px}
.gcoins{flex:none}
.pups{display:flex;gap:6px;justify-content:center;min-height:0}
.pup{font-size:20px;border:3px solid var(--ink);border-radius:6px;background:var(--paper);padding:0 8px;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;gap:2px;font-family:var(--f-display)}
.pup b{font-size:14px;font-weight:400}
.pup[disabled]{opacity:.4}
.pup.on{background:var(--gold)}
.prog{height:14px;border:3px solid var(--ink);border-radius:4px;background:rgba(27,36,24,.3);overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FFE38A);transition:width .3s}
.area{flex:1;position:relative;overflow:hidden;border:3px solid var(--ink);border-radius:10px;touch-action:none;min-height:0}
.area.shoot{background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.7) 0 2px,transparent 3px),radial-gradient(circle at 70% 30%,rgba(255,255,255,.6) 0 2px,transparent 3px),radial-gradient(circle at 45% 55%,rgba(255,255,255,.5) 0 2px,transparent 3px),linear-gradient(180deg,var(--night),var(--night-2) 75%,var(--grass) 75% 79%,var(--dirt) 79%);background-size:180px 180px,220px 220px,160px 160px,100% 100%}
.area.slowmo{filter:hue-rotate(160deg) saturate(.8)}
.tgt{position:absolute;left:0;top:0;width:76px;height:76px;display:grid;place-items:center;font-family:var(--f-letter);font-size:44px;line-height:1;color:#fff;background:var(--tc,var(--dirt));border:3px solid var(--ink);border-radius:6px;box-shadow:inset 0 -7px 0 rgba(0,0,0,.25),inset 0 5px 0 rgba(255,255,255,.3);text-shadow:0 3px 0 rgba(0,0,0,.4);will-change:transform;padding:0 0 6px}
.tgt::before{content:"";position:absolute;top:-14px;left:50%;width:6px;height:11px;margin-left:-3px;background:var(--ink)}
.tgt::after{content:"";position:absolute;top:-18px;left:50%;width:56px;height:6px;margin-left:-28px;background:var(--stone);border:2px solid var(--ink);border-radius:3px;animation:prop .25s linear infinite}
@keyframes prop{50%{transform:scaleX(.3)}}
.tgt.bad,.bad{animation:shake .35s}
@keyframes shake{20%{translate:-8px 0}40%{translate:8px 0}60%{translate:-6px 0}80%{translate:6px 0}}
.hintglow{outline:4px solid var(--gold);outline-offset:3px;animation:glowp .6s ease-in-out infinite}
@keyframes glowp{50%{outline-color:#fff}}
.gunwrap{position:absolute;bottom:14px;left:50%;width:96px;height:48px;margin-left:-48px;transform-origin:30% 55%;transition:transform .08s;z-index:3}
.gunwrap svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.beam{position:absolute;height:8px;margin-top:-4px;transform-origin:0 50%;border-radius:4px;z-index:2;pointer-events:none;animation:beam .22s ease-out forwards;box-shadow:0 0 12px 3px currentColor}
@keyframes beam{from{opacity:1}to{opacity:0;height:2px}}
.px{position:absolute;width:12px;height:12px;border:2px solid var(--ink);z-index:2;pointer-events:none;animation:pop .6s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
.ftxt{position:absolute;z-index:5;font-family:var(--f-display);font-size:24px;color:var(--gold);text-shadow:0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink);pointer-events:none;animation:rise .9s ease-out forwards;white-space:nowrap}
.ftxt.w{color:#fff}
@keyframes rise{to{transform:translateY(-60px);opacity:0}}
.combo{position:absolute;top:10px;left:10px;z-index:5;font-family:var(--f-display);font-size:22px;color:#fff;background:var(--red);border:3px solid var(--ink);border-radius:6px;padding:0 10px;transform:rotate(-6deg)}
.combo.bump{animation:bump .3s}
@keyframes bump{50%{transform:rotate(-6deg) scale(1.3)}}
.area.race{background:linear-gradient(90deg,var(--grass) 0 6%,var(--ink) 6% 7%,#5A6270 7% 93%,var(--ink) 93% 94%,var(--grass) 94%)}
.lanes{position:absolute;inset:0 7%;background-image:repeating-linear-gradient(180deg,#fff 0 34px,transparent 34px 70px),repeating-linear-gradient(180deg,#fff 0 34px,transparent 34px 70px);background-size:6px 70px,6px 70px;background-position:33.3% 0,66.6% 0;background-repeat:repeat-y;opacity:.85}
.gate{position:absolute;left:0;top:0;width:100%;will-change:transform;z-index:2}
.gblk{position:absolute;top:0;display:grid;place-items:center;font-family:var(--f-letter);color:#fff;border:3px solid var(--ink);border-radius:6px;background:var(--tc,var(--blue));box-shadow:inset 0 -7px 0 rgba(0,0,0,.25),inset 0 5px 0 rgba(255,255,255,.3);text-shadow:0 3px 0 rgba(0,0,0,.4);line-height:1;padding-bottom:6px}
.gblk.ok{background:var(--grass);transform:scale(1.2);transition:transform .15s}
.gblk.no{background:var(--red)}
.rcar{position:absolute;bottom:16px;left:0;z-index:3;transition:left .16s ease-out;will-change:left}
.rcar svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}

function tone(f,d,type='square',vol=.07,slide=0,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d=.2,vol=.12,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay;const b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);const s=a.createBufferSource();s.buffer=b;const g=a.createGain();g.gain.value=vol;s.connect(g);g.connect(a.destination);s.start(t)}

const IDB={db:null,open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{try{const r=indexedDB.open('harf-heroes-audio',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('letters'))d.createObjectStore('letters');if(!d.objectStoreNames.contains('clips'))d.createObjectStore('clips')};r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
 st:k=>typeof k==='number'?'letters':'clips',
 async put(k,v){const db=await this.open(),n=this.st(k);return new Promise((res,rej)=>{const t=db.transaction(n,'readwrite');t.objectStore(n).put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
 async del(k){const db=await this.open(),n=this.st(k);return new Promise((res,rej)=>{const t=db.transaction(n,'readwrite');t.objectStore(n).delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
 async all(n){const db=await this.open();return new Promise(res=>{const out={};try{const r=db.transaction(n).objectStore(n).openCursor();r.onsuccess=()=>{const c=r.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};r.onerror=()=>res(out)}catch(e){res(out)}})}};

/* ================= QURAN STRUCTURE ================= */
// Split each surah into parts of up to 5 short ayat (fewer when ayat are long) so every level stays a child-sized bite.
const QPARTS=[];
SURAHS.forEach((s,k)=>{
  const wc_=s.ayat.map(a=>a.split(' ').length),tot=wc_.reduce((x,y)=>x+y,0),len=s.ayat.length;let groups=[];
  if(len<=7&&tot<=32)groups=[s.ayat.map((_,n)=>n)];
  else if(Math.max(...wc_)<=12){const np=Math.ceil(len/6),size=Math.ceil(len/np);for(let n=0;n<len;n+=size)groups.push(s.ayat.map((_,m)=>m).slice(n,n+size))}
  else{let g=[],w=0;wc_.forEach((c,n)=>{if(g.length&&(g.length>=6||w+c>32)){groups.push(g);g=[];w=0}g.push(n);w+=c});if(g.length)groups.push(g)}
  groups.forEach((g,pi)=>QPARTS.push({k,p:pi,from:g[0],to:g[g.length-1],key:s.id+':'+pi}));s.parts=groups.length;});
const qTier=k=>k<4?0:k<10?1:2;
const TIERS=['سهل','متوسط','صعب'];
function partOpen(idx){if(idx===0)return true;return !!S.qp[QPARTS[idx-1].key]}
function renderQuran(){
  let h=header('عالم القرآن')+`<div class="teach">👳 المعلّم يقرأ ← 👦👧 الأطفال يردّدون وراه</div><div style="height:12px"></div>`;
  let nextMarked=false;
  SURAHS.forEach((s,k)=>{
    const parts=QPARTS.map((q,i)=>({q,i})).filter(x=>x.q.k===k);const open=partOpen(parts[0].i);
    h+=`<section class="sura${open?'':' locked'}"><div class="sh"><span class="num">${ar(k+1)}</span><span class="sn">سورة ${s.name}</span><span class="tier">${TIERS[qTier(k)]}</span></div><div class="parts">`;
    parts.forEach(({q,i})=>{const o=partOpen(i),st=S.qp[q.key]||0;let cls='part';if(!o)cls+=' locked';else if(!st&&!nextMarked){cls+=' next';nextMarked=true}
      const lab=s.parts>1?`الآيات ${ar(q.from+1)}–${ar(q.to+1)}`:'السورة كاملة';
      h+=`<button class="${cls}" data-act="qpart" data-i="${i}">${o?'':'🔒 '}${lab}<span class="st">${starStr(st)}</span></button>`});
    h+=`</div></section>`;
  });
  scr.innerHTML=h;
}

function wpick(table){let t=0;for(const r of table)t+=r[0];let x=Math.random()*t;for(const r of table){if((x-=r[0])<=0)return r[1]}return table[table.length-1][1]}
function stickerRarity(boost){const r=Math.random()-(boost?0.15:0);return r<0.08?'epic':r<0.35?'rare':'common'}
function giveSticker(rar){
  const idx=rar==='epic'?[5]:rar==='rare'?[3,4]:[0,1,2];const si=rnd(STICKER_SETS.length),j=idx[rnd(idx.length)];const key=si+'-'+j;
  const dup=!!S.stickers[key];S.stickers[key]=(S.stickers[key]||0)+1;let extra='';
  if(dup){S.coins+=10;extra=`<small>مكرر! +${ar(10)} عملات</small>`}

/* ================= DISTRACTORS / DIFFICULTY ================= */
function simOf(t){const g=SIM.find(g=>g.includes(t));return g?g.filter(x=>x!==t):[]}
function distractors(t,pool,n,d){
  const out=[];const sims=shuffle(simOf(t).filter(x=>pool.includes(x)));const rest=shuffle(pool.filter(x=>x!==t&&!sims.includes(x)));
  while(out.length<n&&(sims.length||rest.length)){if(sims.length&&Math.random()<d*0.85)out.push(sims.shift());else if(rest.length)out.push(rest.shift());else out.push(sims.shift())}
  return out;
}
function letterPool(i){const hi=Math.min(27,Math.max(i+3,5));const p=[];for(let k=0;k<=hi;k++)p.push(k);return p}
function learned(i){const p=[];for(let k=0;k<=i;k++)p.push(k);return p}

/* ================= GAME CORE ================= */
// Shared lives/shields/power-ups for every mini-game.
function makeLife(kind){
  let hearts=baseHearts();let shields=0;
  if(perk('skin')==='shield')shields++;
  if((kind==='shoot'||kind==='whack')){if(perk('blaster')==='heart')hearts++;if(perk('blaster')==='shield')shields++}
  if(kind==='race'){if(perk('car')==='heart')hearts++;if(perk('car')==='shield'||perk('car')==='gold')shields++}
  const L={hearts,max:hearts,shields,freeSlow:(kind==='shoot'||kind==='whack')&&perk('blaster')==='freeze'?1:0,freeHint:perk('blaster')==='hint'?1:0};
  L.hit=function(el){ // returns true if still alive
    if(L.shields>0){L.shields--;sfx.shield();floatOn(el,'🛡️ الدرع حماك!','w');return true}
    if(S.inv.shield>0){S.inv.shield--;save();sfx.shield();floatOn(el,'🛡️ الدرع حماك!','w');return true}
    L.hearts--;return L.hearts>0};
  return L;
}
function heartsHTML(L){return '❤️'.repeat(Math.max(0,L.hearts))+'🤍'.repeat(Math.max(0,L.max-L.hearts))+(L.shields+S.inv.shield>0?'🛡️':'')}
function gameShell(kind,label,opts={}){
  const pups=[];if(opts.slow)pups.push('slow');if(opts.hint)pups.push('hint');
  return `<div class="game"><div class="ghud"><button class="btn sm red" data-act="quit" aria-label="خروج">✕</button><div class="hearts" id="hearts"></div>
  <button class="prompt" data-act="sayprompt"><span class="plab">${label}</span><span class="pl" id="pl"></span><span class="spk">🔊</span></button>
  <div class="cur gcoins">${COIN}<span id="gc">٠</span></div></div><div class="prog"><i id="pg" style="width:0"></i></div>
  ${pups.length?`<div class="pups">${pups.map(p=>`<button class="pup" data-act="pup" data-p="${p}" id="pup-${p}">${PUPS[p].e}<b></b></button>`).join('')}</div>`:''}
  <div class="area ${kind}" id="area"><div class="combo" id="combo" hidden></div></div>${kind==='race'?'<div class="lanebtns"><button class="btn blue" data-act="lane" data-d="-1" aria-label="يسار">◀</button><button class="btn blue" data-act="lane" data-d="1" aria-label="يمين">▶</button></div>':''}</div>`;
}
function updPups(L){['slow','hint'].forEach(p=>{const b=document.getElementById('pup-'+p);if(!b)return;const n=(S.inv[p]||0)+(p==='slow'?L.freeSlow:L.freeHint);b.querySelector('b').textContent=ar(n);b.disabled=n<=0})}
function usePup(L,p){if(p==='slow'&&L.freeSlow>0){L.freeSlow--;return true}if(p==='hint'&&L.freeHint>0){L.freeHint--;return true}if(S.inv[p]>0){S.inv[p]--;save();return true}return false}

     pup(p){if(p==='slow'&&usePup(L,p)){st.slowT=6;area.classList.add('slowmo');sfx.good();upd()}}};const me=G;

  function loop(t){

/* ================= LEVEL FLOW: LETTERS ================= */
function unlockedGames(i){return GAMES.filter(g=>g.from<=i)}
function chooseGames(i,boss){
  const un=unlockedGames(i);const newest=un[un.length-1];const n=un.length<=2?2:3;
  let list=[];if(newest.from>0&&!S.seen[newest.id])list.push(newest.id);
  if(boss&&!list.includes(newest.id))list.push(newest.id);
  const rest=shuffle(un.map(g=>g.id).filter(id=>!list.includes(id)));
  // keep the classics in early worlds, then mix everything
  while(list.length<n&&rest.length)list.push(rest.shift());
  return shuffle(list);
}
function intro(gid,then){
  const g=GAMES.find(x=>x.id===gid);if(S.seen[gid]){then();return}
  S.seen[gid]=1;save();sfx.levelup();confetti(25);playClip('G_'+gid,600);
  overlay(`<h2>لعبة جديدة! 🎉</h2><div class="tut">${g.icon}</div><b style="font-family:var(--f-display);font-size:26px">${g.name}</b><div class="muted" style="font-size:17px">${g.how}</div><button class="btn big gold" data-act="closeov">يلا!</button>`,then);
}
function playSeq(seq,mk,done){let k=0;const step=()=>{if(k>=seq.length){done();return}const gid=seq[k++];intro(gid,()=>RUNNERS[gid](mk(gid,step)))};step()}
function startLetter(i){
  if(!letterOpen(i)){sfx.bad();toast('كمّل الحرف اللي قبله أولاً 🔒');return}
  const run={mist:0,coins:0};const d=clamp(i/27+(ls(i)>=3?.1:0),0,1);const pool=letterPool(i);const rev=learned(i);
  const seq=chooseGames(i,false);
  showLearn(i,()=>{
    playSeq(seq,(gid,next)=>({run,d,pool,target:(mixed)=>mixed&&i>0&&Math.random()<.4?rev[rnd(rev.length)]:i,onWin:next}),()=>{
      const st=run.mist<=1?3:run.mist<=3?2:1;const first=!S.letters[i];S.letters[i]=Math.max(ls(i),st);
      const nw=GAMES.find(g=>g.from===i+1&&(i+1)%4===0);
      finishLevel({stars:st,game:run.coins,base:first?60:25,xp:first?40:20,chest:(first?.35:.2)+(perk('skin')==='lucky'?.2:0),
        note:nw&&first?`🔓 بعد الزعيم تنفتح لعبة جديدة: ${nw.icon} ${nw.name}`:'',
        next:()=>{const n=i+1;if(n<28&&letterOpen(n))startLetter(n);else if(i%4===3&&bossOpen(Math.floor(i/4)))startBoss(Math.floor(i/4));else go('letters')}});

function chunks(words){const n=Math.ceil(words.length/7);const size=Math.ceil(words.length/n);const out=[];for(let i=0;i<words.length;i+=size)out.push(words.slice(i,i+size));return out}
function decoyWords(k,exclude,n){const all=[];SURAHS.forEach((s,j)=>{if(j!==k)s.ayat.forEach(a=>a.split(' ').forEach(w=>all.push(w)))});return shuffle(all.filter(w=>!exclude.includes(w))).slice(0,n)}
function buildAyah(idx,j,run,ci=0){

  const mastered=(S.qp[P.key]||0)>=3;const ghostMode=mastered?'none':tier===2?'peek':'show';
  const dec=tier===0?0:tier===1?2:3;const decoys=decoyWords(P.k,words,dec);
  go('qbuild',{ingame:true});cur.q={idx,run};
  const blocks=shuffle([...part.map(w=>({w,real:1})),...decoys.map(w=>({w,real:0}))]);
  scr.innerHTML=`${exitHdr('ابنِ الآية '+ar(n+1),'quran',`<div class="cur" style="margin-inline-start:auto">${COIN}<span id="gc">${ar(run.coins)}</span></div>`)}
  <div class="prog"><i style="width:${(j+ci/ch.length)/total*100}%"></i></div>
  <div class="build">
    ${ghostMode==='none'?'<div class="qstep">🏆 وضع الأبطال: ابنِها من حفظك!</div>':`<div class="ghost" id="ghost">${s.ayat[n]}</div>`}
    ${ghostMode==='peek'?'<div class="qstep" id="peekmsg">👀 احفظ الآية… بتختفي!</div>':''}
    <div class="wall" id="wall">${done.map(w=>`<span class="wb placed prev">${w}</span>`).join('')}</div>
    <div class="blocks" id="blocks">${blocks.map(b=>`<button class="wb" data-act="word">${b.w}</button>`).join('')}</div>
    ${dec?`<div class="muted" style="text-align:center;color:#fff;text-shadow:0 1px 0 var(--ink)">⚠️ فيه مكعبات مو من الآية!</div>`:''}
    <div class="rowc"><button class="btn sm blue" data-act="playayah" data-n="${n}">🔊 اسمع الآية</button>${ghostMode==='peek'?'<button class="btn sm stone" data-act="peek">👀 نظرة</button>':''}<button class="btn sm gold" data-act="qhint" id="qh">💡 ${ar(S.inv.hint)}</button></div>
  </div>`;
  if(ghostMode==='peek'){const g=document.getElementById('ghost'),m=document.getElementById('peekmsg');setTimeout(()=>{g.classList.add('hide');m.textContent='🧠 الحين ابنِها من ذاكرتك'},4000)}
  let pos=0,wrong=0;
  const glow=()=>document.querySelectorAll('#blocks .wb:not(.gone)').forEach(b=>{if(b.textContent===part[pos])b.classList.add('hintglow')});
  cur.hint=()=>{if(S.inv.hint<=0){toast('ما عندك تلميحات. تلقاها في الصناديق 💡');return}S.inv.hint--;save();document.getElementById('qh').innerHTML='💡 '+ar(S.inv.hint);glow()};
  cur.word=(btn)=>{
    if(btn.classList.contains('gone'))return;
    if(btn.textContent===part[pos]){
      btn.classList.add('gone');const p=document.createElement('span');p.className='wb placed';p.textContent=part[pos];document.getElementById('wall').appendChild(p);
      pos++;wrong=0;run.coins+=3;document.getElementById('gc').textContent=ar(run.coins);sfx.place();
      document.querySelectorAll('.wb.hintglow').forEach(b=>b.classList.remove('hintglow'));
      if(pos>=part.length){
        if(ci+1<ch.length){sfx.good();setTimeout(()=>{if(cur.name==='qbuild')buildAyah(idx,j,run,ci+1)},600);return}
        sfx.good();confetti(25);document.querySelectorAll('#blocks .wb').forEach(b=>b.disabled=true);
        const nextFn=()=>{if(cur.name!=='qbuild')return;stopAyah();if(j+1<total)buildAyah(idx,j+1,run);else afterBuild(idx,run)};
        const box=document.querySelector('.build .rowc');box.innerHTML=`<div class="teach">👳 اسمع وردّد…</div><button class="btn gold" data-act="qnext">التالي ▶</button>`;cur.qnext=nextFn;
        playAyah(s.id,n+1,()=>setTimeout(nextFn,600));
      }
    }else{
      wrong++;run.mist++;sfx.bad();bump(btn);
      if(wrong>=(perk('skin')==='quran'?1:2))glow();
    }
  };
}
function afterBuild(idx,run){const P=QPARTS[idx];if(qTier(P.k)>=1&&P.to-P.from>=2)orderAyat(idx,run);else quiz(idx,run,0)}
function orderAyat(idx,run){
  const P=QPARTS[idx],s=SURAHS[P.k];const ns=[];for(let n=P.from;n<=P.to;n++)ns.push(n);let pos=0;
  go('qorder',{ingame:true});cur.q={idx,run};
  scr.innerHTML=`${exitHdr('رتّب الآيات','quran',`<div class="cur" style="margin-inline-start:auto">${COIN}<span id="gc">${ar(run.coins)}</span></div>`)}
  <p class="qstep">اضغط الآيات بالترتيب: الأولى ثم اللي بعدها 🔢</p><div class="ayat" id="ord">${shuffle(ns).map(n=>`<button class="ayah" data-act="ord" data-n="${n}"><span class="an">؟</span><span class="tx">${s.ayat[n]}</span></button>`).join('')}</div>`;
  cur.ord=b=>{if(b.classList.contains('placed'))return;const n=+b.dataset.n;
    if(n===ns[pos]){pos++;b.classList.add('placed');b.querySelector('.an').textContent=ar(n+1);run.coins+=5;document.getElementById('gc').textContent=ar(run.coins);sfx.place();
      if(pos>=ns.length){sfx.good();confetti(20);setTimeout(()=>{if(cur.name==='qorder')quiz(idx,run,0)},900)}}
    else{run.mist++;sfx.bad();bump(b)}};
}
function quiz(idx,run,qn){
  const P=QPARTS[idx],s=SURAHS[P.k],tier=qTier(P.k);const Q=3+tier;const nOpt=tier===0?3:4;
  if(qn>=Q){
    const st=run.mist<=1?3:run.mist<=4?2:1;const first=!S.qp[P.key];S.qp[P.key]=Math.max(S.qp[P.key]||0,st);
    const nAy=P.to-P.from+1;const qb=perk('skin')==='quran'?1.5:1;
    finishLevel({stars:st,game:Math.round(run.coins*qb),base:(first?70:25)+nAy*8,xp:first?60:30,chest:(first?.6:.25)+(perk('skin')==='lucky'?.2:0),big:first&&P.to===s.ayat.length-1,
      note:first&&P.to===s.ayat.length-1?`🌟 ختمت سورة ${s.name}!`:'',
      next:()=>{if(idx+1<QPARTS.length)startQPart(idx+1);else go('quran')}});return}
  let cands=[];for(let n=P.from;n<=P.to;n++)if(s.ayat[n].split(' ').length>=2)cands.push(n);if(!cands.length)s.ayat.forEach((a,n)=>{if(a.split(' ').length>=2)cands.push(n)});
  const n=cands[rnd(cands.length)];const words=s.ayat[n].split(' ');const wi=rnd(words.length);const ans=words[wi];
  const same=[...new Set(s.ayat.join(' ').split(' '))].filter(w=>w!==ans);const pool=same.length>=nOpt-1?same:[...same,...decoyWords(P.k,[ans],5)];
  const opts=shuffle([ans,...shuffle(pool).slice(0,nOpt-1)]);
  go('qquiz',{ingame:true});cur.q={idx,run};
  scr.innerHTML=`${exitHdr('أكمل الآية','quran',`<div class="cur" style="margin-inline-start:auto">${COIN}<span id="gc">${ar(run.coins)}</span></div>`)}
  <div class="prog"><i style="width:${qn/Q*100}%"></i></div>
  <div class="panel" style="margin-top:12px"><div class="qtext">${words.map((w,i)=>i===wi?'<span class="blank" id="blank">&nbsp;</span>':w).join(' ')}</div></div>
  <p class="qstep">أي كلمة ناقصة؟ 🤔</p>
  <div class="blocks">${opts.map(o=>`<button class="wb" data-act="opt">${o}</button>`).join('')}</div>`;
  let done=false;
  cur.opt=(btn)=>{if(done)return;if(btn.textContent===ans){done=true;const b=document.getElementById('blank');b.textContent=ans;b.className='wb placed';run.coins+=8;document.getElementById('gc').textContent=ar(run.coins);sfx.good();setTimeout(()=>sfx.coin(),120);setTimeout(()=>{if(cur.name==='qquiz')quiz(idx,run,qn+1)},1100)}
    else{run.mist++;sfx.bad();bump(btn);btn.disabled=true;btn.style.opacity=.45}};
}

/* ================= REWARD ================= */
function addXP(n){S.xp+=Math.round(n*xpMult());let ups=0;while(S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;ups++}return ups}
function finishLevel(o){
  stopGame();let total=Math.round((o.game+o.base)*coinMult());let x2=false;if(S.inv.x2>0){S.inv.x2--;total*=2;x2=true}
  S.coins+=total;const ups=addXP(o.xp);let upHTML='';
  if(ups){S.coins+=60*ups;S.gems+=2*ups;const k=['shield','slow','hint'][rnd(3)];S.inv[k]+=ups;upHTML=`<div class="reveal burst"><span class="rbadge legend">ترقية!</span>صرت مستوى ${ar(S.lvl)} 🎉<div class="earn" style="font-size:22px">${COIN}+${ar(60*ups)} ${GEM}+${ar(2*ups)} ${PUPS[k].e}</div></div>`}
  save();const chest=Math.random()<o.chest;
  sfx.win();confetti(o.big?90:50);
  const ov=overlay(`<h2>${o.stars===3?'رهيييب!':o.stars===2?'أحسنت!':'كفو!'}</h2>
    <div class="bigstars">${[1,2,3].map(n=>`<span class="${n<=o.stars?'on':''}" style="animation-delay:${n*.25}s">★</span>`).join('')}</div>
    <div class="earn">${COIN}<span id="cnt">٠</span>${x2?'<span style="color:var(--red)">×٢</span>':''}</div>
    ${o.note?`<div class="muted" style="font-size:16px;color:var(--grass-d)">${o.note}</div>`:''}
    ${upHTML}
    ${chest?`<div class="muted" id="chm">لقيت صندوق مفاجأة! افتحه 👇</div><button class="chestbtn" data-act="lvlchest" aria-label="افتح الصندوق">🎁</button>`:''}
    <div class="btns"><button class="btn big gold" data-act="nextlvl">التالي ▶</button><button class="btn stone" data-act="go" data-to="home">البيت</button></div>`);
  cur.next=o.next;playClip('P_win',700);
  let c=0;const step=Math.max(1,Math.ceil(total/30));const iv=setInterval(()=>{c=Math.min(total,c+step);const el=ov.querySelector('#cnt');if(!el){clearInterval(iv);return}el.textContent=ar(c);if(c>=total){clearInterval(iv);sfx.coin()}},35);
  if(ups)setTimeout(()=>sfx.levelup(),900);
  updTop();
}

/* ================= PARENTS & TIME ================= */
let holdT=null,held=false;
function bindGear(){
  const g=document.getElementById('gear');if(!g)return;
  const start=e=>{e.preventDefault();held=false;g.classList.add('holding');holdT=setTimeout(()=>{held=true;g.classList.remove('holding');parentGate()},1500)};
  const end=()=>{g.classList.remove('holding');clearTimeout(holdT)};
  g.addEventListener('pointerdown',start);g.addEventListener('pointerup',end);g.addEventListener('pointerleave',end);g.addEventListener('pointercancel',end);
  g.addEventListener('click',()=>{if(!held)toast('للوالدين: اضغط مطولاً على ⚙️');held=false});
}
function parentGate(then){
  const a=3+rnd(7),b=3+rnd(7);
  overlay(`<h2 style="font-size:28px">للوالدين فقط</h2><div class="muted">كم حاصل ${a} × ${b} ؟</div><input class="field" id="pg_in" type="number" inputmode="numeric" autocomplete="off"><div class="btns"><button class="btn" data-act="pgok">دخول</button><button class="btn stone" data-act="closeov">إلغاء</button></div>`);
  cur.pg={ans:a*b,then};setTimeout(()=>{const i=document.getElementById('pg_in');if(i)i.focus()},100);
}
function settings(){
  const lim=S.settings.limit;
  overlay(`<h2 style="font-size:28px">إعدادات الوالدين</h2>
  <div class="set"><label for="nm_in">اسم البطل</label><input class="field" id="nm_in" maxlength="16" value="${esc(S.name)}"></div>
  <div class="set"><label>وقت اللعب اليومي</label><div class="chips">${[10,20,30,45,0].map(m=>`<button class="chip${m===lim?' on':''}" data-act="setlim" data-m="${m}">${m?ar(m)+' د':'بدون حد'}</button>`).join('')}</div>
  <div class="muted">اليوم: ${ar(Math.floor(S.play.sec/60))} دقيقة لعب</div></div>
  <div class="chips"><button class="chip${S.settings.sound?' on':''}" data-act="tgl" data-k="sound">🔊 المؤثرات</button><button class="chip${S.settings.voice?' on':''}" data-act="tgl" data-k="voice">🗣️ صوت الحروف</button><button class="chip" data-act="extra">+١٠ دقائق اليوم</button></div>
  <button class="btn blue" data-act="voices">🎙️ سجّل بصوتك (حروف، صور، شرح)</button>
  <div class="btns"><button class="btn" data-act="saveset">حفظ</button><button class="btn red sm" data-act="reset1">مسح التقدم</button></div>`);
}
let vSel=0,vGrp='L',rec=null;
function vItems(){if(vGrp==='L')return LETTERS.map((L,i)=>({k:i,t:'حرف '+L[1],e:L[0],lt:1}));return CLIP_GROUPS.find(g=>g.id===vGrp).items}
function hasVoice(k){return !!CUSTOM[k]||(typeof k==='string'&&VCLIPS.includes(k))}
function playSel(){if(typeof vSel==='number')playLetter(vSel);else if(!playClip(vSel))toast('ما فيه تسجيل لهذا بعد')}
function voicesPanel(){
  const items=vItems();if(!items.some(x=>x.k===vSel))vSel=items[0].k;const sel=items.find(x=>x.k===vSel);
  const tabs=[['L','الحروف'],...CLIP_GROUPS.map(g=>[g.id,g.name])];
  overlay(`<h2 style="font-size:26px">سجّل بصوتك 🎙️</h2>
  <div class="chips">${tabs.map(([k,t])=>`<button class="chip${k===vGrp?' on':''}" data-act="vgrp" data-g="${k}">${t}</button>`).join('')}</div>
  <div class="chips">${items.map(x=>`<button class="chip${x.lt?' lt':''}${x.k===vSel?' on':''}${CUSTOM[x.k]?' cus':''}" data-act="vsel" data-k="${x.k}" style="${!x.lt&&!hasVoice(x.k)?'opacity:.55':''}">${x.e}</button>`).join('')}</div>
  <div class="panel" style="width:100%"><div class="muted">قل:</div><b style="font-family:var(--f-letter);font-size:22px;line-height:1.6">«${sel.t}»</b></div>
  <div class="btns"><button class="btn sm blue" data-act="vplay">▶ اسمع</button><button class="btn sm red" data-act="vrec" id="vrec">🎙️ سجّل</button><button class="btn sm violet" data-act="vfile">📁 ملف</button>${CUSTOM[vSel]?'<button class="btn sm stone" data-act="vdel">↩️ احذف تسجيلي</button>':''}</div>
  <div class="muted">الأخضر = مسجّل على هذا الجهاز. التسجيل بالمايك يشتغل لما تفتح اللعبة من رابطها المباشر؛ داخل Claude استخدم «ملف».</div>
  <button class="btn" data-act="closeov">تم</button>`);
}
async function setCustom(k,blob){try{await IDB.put(k,blob)}catch(e){toast('ما قدرنا نحفظ الصوت على هذا الجهاز');return}try{if(CUSTOM[k])URL.revokeObjectURL(CUSTOM[k]);CUSTOM[k]=URL.createObjectURL(blob)}catch(e){}Object.keys(lcache).forEach(x=>{if(x.startsWith('blob:'))delete lcache[x]});toast('تم حفظ صوتك ✅');playSel();voicesPanel()}
async function recLetter(){
  if(rec){try{rec.stop()}catch(e){}return}
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];const r=new MediaRecorder(stream);rec=r;const key=vSel;
    r.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    r.onstop=()=>{stream.getTracks().forEach(t=>t.stop());rec=null;const b=new Blob(chunks,{type:r.mimeType||'audio/webm'});if(b.size>800)setCustom(key,b);else voicesPanel()};
    r.start();const b=document.getElementById('vrec');if(b){b.textContent='⏹ إيقاف';b.classList.add('violet')}
    setTimeout(()=>{if(rec===r)try{r.stop()}catch(e){}},vGrp==='G'?9000:4000);
  }catch(e){rec=null;toast('الميكروفون غير متاح هنا. اختر «ملف» وارفع تسجيل من جوالك')}
}
document.getElementById('audfile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)setCustom(vSel,f)});
function limitSec(){return S.settings.limit?(S.settings.limit+S.play.extra)*60:Infinity}
function onBreak(){return S.play.sec>=limitSec()}
function checkBreak(){if(onBreak()&&!ovEl)showBreak()}
function showBreak(){
  overlay(`<h2>استراحة البطل 😴</h2><div class="mbox">🛌</div><div class="muted">لعبت كثير اليوم وتعلمت حروف وآيات! الأبطال يرتاحون عشان يرجعون أقوى. نشوفك بكرة 💪</div><div class="earn" style="font-size:22px">صندوقك اليومي ينتظرك بكرة 🎁</div><button class="btn stone sm" data-act="parentbreak">للوالدين</button>`);
  cur.breakOpen=true;
}
setInterval(()=>{
  if(document.visibilityState!=='visible')return;
  if(S.play.date!==today()){S.play={date:today(),sec:0,extra:0}}
  if(cur.breakOpen)return;
  S.play.sec++;if(S.play.sec%10===0)save();
  if(onBreak()&&!app.classList.contains('ingame')&&!ovEl)showBreak();
},1000);

/* ================= EVENTS ================= */
function onClick(e){
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;ac();
  switch(a){
    case 'go':stopGame();closeOv(true);cur.breakOpen=false;go(b.dataset.to,{tab:b.dataset.tab});sfx.tap();break;
    case 'tab':go('shop',{tab:b.dataset.tab});sfx.tap();break;
    case 'ctab':go('coll',{tab:b.dataset.tab});sfx.tap();break;
    case 'daily':claimDaily();break;
    case 'letter':startLetter(+b.dataset.i);break;
    case 'boss':startBoss(+b.dataset.w);break;
    case 'qpart':startQPart(+b.dataset.i);break;
    case 'buy':buy(b.dataset.id);break;
    case 'equip':S.equip[b.dataset.cat]=b.dataset.id;save();sfx.good();go('shop',{tab:b.dataset.cat});break;
    case 'pet':S.equip.pet=b.dataset.id;save();sfx.good();go('coll',{tab:'pet'});break;
    case 'upg':buyUpg(b.dataset.id);break;
    case 'buybox':openMystery();break;
    case 'lvlchest':{const z=b.parentElement;b.remove();const o=rollBox('level');save();sfx.chest();confetti(40);const d=document.createElement('div');d.innerHTML=o.html;z.insertBefore(d.firstChild,z.querySelector('.btns'));const m=z.querySelector('#chm');if(m)m.remove();updTop();break}
    case 'closeov':closeOv();break;
    case 'nextlvl':{const n=cur.next;closeOv(true);if(onBreak()){go('home');break}n&&n();break}
    case 'retry':{const r=cur.retry;closeOv(true);r&&r();break}
    case 'quit':stopGame();go('home');break;
    case 'sayprompt':G&&G.say&&G.say();break;
    case 'pup':G&&G.pup&&G.pup(b.dataset.p);break;
    case 'lane':G&&G.move&&G.move(+b.dataset.d);break;
    case 'saylet':{const el=document.getElementById('bigl');bump(el,'tap');sfx.coin();playLetter(cur.learn.i);break}
    case 'learnnext':{const n=cur.learn.next;n&&n();break}
    case 'playayah':{const n=+b.dataset.n;const s=SURAHS[QPARTS[cur.q.idx].k];document.querySelectorAll('.ayah').forEach(x=>x.classList.remove('playing'));if(b.classList.contains('ayah'))b.classList.add('playing');playAyah(s.id,n+1,()=>b.classList.remove('playing'));break}
    case 'playbasm':playAyah(1,1,null);break;
    case 'playall':playAll();break;
    case 'startbuild':buildAyah(cur.q.idx,0,cur.q.run);break;
    case 'word':cur.word&&cur.word(b);break;
    case 'qhint':cur.hint&&cur.hint();break;
    case 'qnext':cur.qnext&&cur.qnext();break;
    case 'peek':{const g=document.getElementById('ghost');if(g){g.classList.remove('hide');setTimeout(()=>g.classList.add('hide'),2500)}break}
    case 'ord':cur.ord&&cur.ord(b);break;
    case 'opt':cur.opt&&cur.opt(b);break;
    case 'pgok':{const v=+(document.getElementById('pg_in')||{}).value;if(v===cur.pg.ans){const t=cur.pg.then;closeOv(true);t?t():settings()}else{sfx.bad();toast('إجابة غير صحيحة')}break}
    case 'parentbreak':closeOv(true);cur.breakOpen=false;parentGate(()=>settings());break;
    case 'setlim':S.settings.limit=+b.dataset.m;save();b.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));break;
    case 'tgl':S.settings[b.dataset.k]=!S.settings[b.dataset.k];save();b.classList.toggle('on',S.settings[b.dataset.k]);break;
    case 'extra':S.play.extra+=10;save();toast('تمت إضافة ١٠ دقائق');break;
    case 'voices':voicesPanel();break;
    case 'vgrp':vGrp=b.dataset.g;vSel=null;voicesPanel();break;
    case 'vsel':vSel=vGrp==='L'?+b.dataset.k:b.dataset.k;playSel();voicesPanel();break;
    case 'vplay':playSel();break;
    case 'sayword':playClip('W'+cur.learn.i);break;
    case 'vrec':recLetter();break;
    case 'vfile':document.getElementById('audfile').click();break;
    case 'vdel':IDB.del(vSel).catch(()=>{});try{URL.revokeObjectURL(CUSTOM[vSel])}catch(e){}delete lcache[CUSTOM[vSel]];delete CUSTOM[vSel];toast('انحذف تسجيلك');voicesPanel();break;
    case 'saveset':{const v=(document.getElementById('nm_in')||{}).value;if(v&&v.trim())S.name=v.trim().slice(0,16);save();closeOv(true);go('home');break}
    case 'reset1':b.outerHTML='<button class="btn red sm" data-act="reset2">متأكد؟ اضغط للمسح</button>';break;
    case 'reset2':S=defState();save();closeOv(true);go('home');toast('تم مسح التقدم');break;
  }
}
app.addEventListener('click',onClick);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'){save();stopAyah()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('pg_in')){const b=document.querySelector('[data-act="pgok"]');b&&b.click()}});

if(S.play.date!==today())S.play={date:today(),sec:0,extra:0};
go('home');
</script>
