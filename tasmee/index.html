<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F3EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1411" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر التسميع">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<title>دفتر التسميع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
<style>
/* ===== tokens ===== */
:root{
  --bg:#EEF3EE; --surface:#FFFFFF; --ink:#18302A; --muted:#56675F; --line:#D5DFD8; --fill:#E2EBE5; --segOn:#18302A;
  --green:#2E6B50; --green-soft:#DCEBE2; --gold:#B5862A; --gold-soft:#F6ECD6; --goldInk:#845C0E;
  --rose:#B3453A; --rose-soft:#F6DFDB; --roseInk:#A2382E; --onGreen:#FFFFFF;
  --blue:#1F6E8C; --blue-soft:#DDEFF5; --lav:#4B4BA0; --lav-soft:#E8E8F8;
  --r-lg:14px; --r:10px; --r-sm:6px; --navh:0px;
  --ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --quran:"Amiri","Traditional Arabic","Times New Roman",serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A17;--surface:#17241F;--ink:#E6EFEA;--muted:#97AAA2;--line:#2A3B35;--fill:#1F2E28;--segOn:#E6EFEA;
  --green:#5FB08A;--green-soft:#1D3329;--gold:#D9AE55;--gold-soft:#2E2716;--goldInk:#D9AE55;
  --rose:#E07A6E;--rose-soft:#36201D;--roseInk:#E07A6E;--onGreen:#0F1A17;
  --blue:#7CC3DD;--blue-soft:#163039;--lav:#B4B4F0;--lav-soft:#26264A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A17;--surface:#17241F;--ink:#E6EFEA;--muted:#97AAA2;--line:#2A3B35;--fill:#1F2E28;--segOn:#E6EFEA;
  --green:#5FB08A;--green-soft:#1D3329;--gold:#D9AE55;--gold-soft:#2E2716;--goldInk:#D9AE55;
  --rose:#E07A6E;--rose-soft:#36201D;--roseInk:#E07A6E;--onGreen:#0F1A17;
  --blue:#7CC3DD;--blue-soft:#163039;--lav:#B4B4F0;--lav-soft:#26264A;color-scheme:dark}

/* ===== base ===== */
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.hasnav{--navh:calc(60px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
button,[data-st],[data-who],.slist li{transition:opacity .12s,transform .12s,background-color .15s}
button:active,[data-st]:active,[data-who]:active{opacity:.6}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(120px + var(--navh))}
h2{font-size:19px;font-weight:700;margin:14px 0 10px;line-height:1.4}
.lead{color:var(--muted);margin:0 0 6px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
.msg{color:var(--roseInk);text-align:center;font-size:13px;min-height:1.4em;margin:2px 0 6px}
.okmsg{color:var(--green);text-align:center;min-height:1.4em;margin:6px 0}
.msg:empty,.okmsg:empty{display:none}
.lbl{font-size:13px;font-weight:500;color:var(--muted);margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.card details summary{padding:8px 0;min-height:36px;display:flex;align-items:center;cursor:pointer}
details{font-size:13px;color:var(--muted);margin-top:6px}
details summary{cursor:pointer;color:var(--green);font-weight:500}
details p{margin:6px 0}

/* ===== header ===== */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;margin:0}
.bbox{display:flex;align-items:center;gap:10px;min-width:0;cursor:default}
.bmark{flex:none;width:36px;height:36px;background:var(--green);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.btxt{min-width:0;line-height:1.25}
.btxt h1{font-family:var(--quran);font-size:21px;font-weight:700;color:var(--green);margin:0;white-space:nowrap}
.btxt small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.upill{flex:none;display:flex;align-items:center;gap:6px;max-width:46%;min-height:36px;padding:6px 10px 6px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--ink)}
.upill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upill svg{flex:none;width:12px;height:12px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== bottom navigation ===== */
.tnav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 3px;font-size:11px;font-weight:500;color:var(--muted)}
.tnav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tnav button[aria-current="page"]{color:var(--green);font-weight:700}
.tnav button[aria-current="page"] svg{stroke-width:2}
main.swap{animation:swap .18s ease-out}
@keyframes swap{from{opacity:0;transform:translateY(6px)}}

/* ===== buttons ===== */
.btn{width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:700;background:var(--green);color:var(--onGreen)}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500;font-size:14px;padding:8px}
.btn.line{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:15px;font-weight:500;padding:12px}
.btn:active,.sp:active,.nm:active,.pickgrid button:active{transform:scale(.98)}
.back{color:var(--green);font-weight:500;padding:8px 0}
.tlink{display:block;margin:18px auto 0;padding:8px 16px;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
/* small outline buttons */
.toggle,.chg,.side,.excb,.lvl-x,.lockbtn,.edt,.picked button,.planrow button{font-size:13px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 12px;min-height:34px;white-space:nowrap}
.side,.excb,.lvl-x{display:inline-flex;align-items:center;justify-content:center}
.toggle[aria-pressed="true"]{background:var(--rose-soft);color:var(--roseInk);border-color:transparent}
.chg{margin-inline-start:4px;color:var(--green)}
.excb.undo2{color:var(--muted)}
.lockbtn{color:var(--roseInk)}
.more{display:block;width:100%;margin-top:10px;padding:10px;border-radius:var(--r);border:1px solid var(--line);color:var(--green);font-size:13px;font-weight:500}

/* ===== segmented controls ===== */
.tabs,.seg,.seg2{display:flex;background:var(--fill);border-radius:var(--r);padding:3px;gap:2px}
.seg{margin:12px 0}
.seg2{margin:2px 0 14px}
.tabs button,.seg button,.seg2 button{flex:1;padding:7px 6px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"],.seg button[aria-pressed="true"],.seg2 button[aria-pressed="true"]{background:var(--segOn);color:var(--bg);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.rtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.rtabs button{flex:none;padding:8px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:13px}
.rtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dayseg{display:flex;gap:8px;margin:12px 0 4px}
.dayseg button{flex:1;padding:9px 6px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--muted)}
.dayseg button[aria-pressed="true"]{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:700}
.dayseg button[data-dm="y"][aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--goldInk)}

/* ===== badges ===== */
.tag,.pill,.kind{display:inline-block;font-size:12px;font-weight:500;line-height:1.5;padding:1px 8px;border-radius:var(--r-sm);white-space:nowrap}
.t-good{background:var(--green-soft);color:var(--green)} .t-mid{background:var(--gold-soft);color:var(--goldInk)} .t-bad{background:var(--rose-soft);color:var(--roseInk)} .t-na{background:var(--fill);color:var(--muted)}
.pill.h{background:var(--gold-soft);color:var(--goldInk)} .pill.e{background:var(--rose-soft);color:var(--roseInk)} .pill.z{background:var(--green-soft);color:var(--green)}
.pill.r0{background:#1F6B4A;color:#fff}.pill.r1{background:var(--green-soft);color:var(--green)}.pill.r2{background:var(--blue-soft);color:var(--blue)}.pill.r3{background:var(--gold-soft);color:var(--goldInk)}.pill.r4{background:var(--rose-soft);color:var(--roseInk)}
.kind{background:var(--fill);color:var(--muted)}
.kind.near{background:var(--green-soft);color:var(--green)}.kind.far{background:var(--gold-soft);color:var(--goldInk)}.kind.lesson{background:var(--lav-soft);color:var(--lav)}

/* ===== who are you / welcome ===== */
.welcome{text-align:center;padding-top:10px}
.wlogo{width:min(230px,60%);aspect-ratio:var(--ar,1);margin:6px auto 12px;background:var(--ink);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.welcome h2{margin:6px 0 2px;font-size:22px}
.welcome .lead{margin:0 0 4px;font-size:14px}
.pq{width:100%;margin:16px 0 2px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font:inherit;font-size:16px;outline:none;text-align:start}
.pq:focus{border-color:var(--green)}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:12px;text-align:center}
.pickgrid button{padding:14px 10px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:15px}
.me{display:flex;align-items:center;justify-content:space-between;background:var(--green-soft);color:var(--green);border-radius:var(--r);padding:10px 14px;margin-top:6px}
.me b{font-size:16px}
.me button{font-size:13px;color:var(--green);text-decoration:underline}
.mebtns{display:flex;align-items:center;gap:12px}
.me button.todayb{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:17px;text-decoration:none;line-height:1;display:grid;place-items:center}

/* ===== recording: names ===== */
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px 0 8px}
.nm{padding:11px 8px;min-height:46px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:14px;line-height:1.35;text-align:center;display:flex;align-items:center;justify-content:center}
.nm[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
.nm.add,.nm.self{color:var(--green)}
.nm:disabled{background:transparent;color:var(--muted);cursor:default}
.newname{display:flex;gap:8px;margin-top:4px;flex-wrap:nowrap}
.newname input{flex:1;min-width:0;padding:10px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);outline:none}
.newname input:focus{border-color:var(--green)}
.newname button{padding:0 18px;border-radius:var(--r);background:var(--green);color:var(--onGreen);font-weight:700}
.picked{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 14px;margin:6px 0 4px}
.picked span{font-size:13px;color:var(--muted)}
.picked b{flex:1;font-size:16px}
#unpick,#lunpick{min-height:36px;padding-inline:14px}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{flex:1;min-width:90px;padding:12px 8px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:15px}
.choice button small{display:block;font-family:var(--quran);font-size:15px;font-weight:400;color:var(--muted);margin-top:2px;line-height:1.4}
.choice button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.choice button.redo[aria-pressed="true"]{border-color:var(--rose);background:var(--rose-soft);color:var(--roseInk)}
.locked{display:flex;align-items:center;gap:10px;color:var(--green);font-weight:500;font-size:13px}
.locked i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--green-soft);display:grid;place-items:center;flex:none}
.ybanner{margin:6px 0 0;padding:9px 12px;border-radius:var(--r);background:var(--gold-soft);color:var(--goldInk);font-size:14px;text-align:center}

/* ===== recording: part card ===== */
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ph b{font-size:16px}
.ph .amt{font-size:12px;color:var(--muted);font-weight:500;background:var(--fill);padding:2px 8px;border-radius:var(--r-sm)}
.skipped .body{display:none}
.rng,.sum{display:flex;align-items:baseline;justify-content:center;gap:6px;flex-wrap:wrap;text-align:center}
.rng{align-items:center;margin:4px 0 2px}
.sum{min-height:44px;margin:2px 0 8px}
.rng .s,.sum .s{font-family:var(--quran);font-size:23px;font-weight:700;line-height:1.3}
.rng .w,.sum .w{font-size:12px;color:var(--muted)}
.nudge{display:inline-flex;direction:ltr;gap:2px}
.nudge button{width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--muted);font-size:11px}
.planbox{background:var(--bg);border-radius:var(--r);padding:12px;text-align:center;margin:4px 0 8px}
.planbox small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.planbox b{font-family:var(--quran);font-size:21px;line-height:1.4}
.planhint{font-size:12px;color:var(--muted);margin:8px 2px 0}
.planhint b{color:var(--ink)}
.manual{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.manual label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.manual input{width:100%;padding:9px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);font-family:var(--quran);font-size:17px;font-weight:700;outline:none}
.manual input:focus{border-color:var(--green)}
.manual input.bad{border-color:var(--rose)}
[data-picker][hidden]{display:none}
.shint{font-size:12px;color:var(--goldInk);text-align:center;margin:0}
.shint:empty{display:none}
.sstrip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.sch{flex:none;font-family:var(--quran);font-size:17px;font-weight:700;padding:6px 14px;border-radius:8px;background:var(--bg);border:1px solid var(--line);line-height:1.3}
.sch.in{background:var(--green-soft);border-color:var(--green-soft);color:var(--green)}
.sch.end{background:var(--green);border-color:var(--green);color:var(--onGreen)}
.jz{flex:none;align-self:center;font-size:12px;font-weight:700;color:var(--green);padding:6px 8px;border-radius:8px;border:1px solid var(--line);margin-inline-start:6px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;margin-top:4px}
.sgrid .sch{padding:6px 4px;font-size:15px;text-align:center;min-height:40px}
.sgrid .tail{display:none}
.sgrid.lv1 .t1,.sgrid.lv2 .t2{display:block}
.sgrid .jz{grid-column:1/-1;justify-self:stretch;text-align:start;border:0;border-bottom:1px solid var(--line);border-radius:0;margin:8px 0 0;padding:4px 2px;font-size:13px;min-height:40px}
.sgrid .jz small{font-weight:400;color:var(--muted);font-size:12px;margin-inline-start:6px}
/* dual slider: الناس on the right */
.dual{position:relative;height:46px;direction:ltr;margin:6px 4px 0}
.dual .track{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:var(--line)}
.dual .fill{position:absolute;top:20px;height:6px;border-radius:3px;background:var(--green)}
.dual input{position:absolute;inset:0;width:100%;height:46px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input::-webkit-slider-runnable-track{background:none;height:46px}
.dual input::-moz-range-track{background:none}
.dual input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:28px;height:28px;margin-top:9px;border-radius:50%;background:var(--surface);border:3px solid var(--green);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:grab}
.dual input::-moz-range-thumb{pointer-events:auto;width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--green);cursor:grab}
.ticks{position:relative;height:18px;direction:ltr;margin:0 4px;font-size:11px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticks span::before{content:"";display:block;width:1px;height:5px;background:var(--muted);margin:0 auto 1px;opacity:.6}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:0 2px}
/* steppers */
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.st{display:flex;align-items:center;justify-content:space-between;border-radius:12px;padding:6px;background:var(--bg);border:1px solid var(--line)}
.st.h .n small{color:var(--goldInk)} .st.e .n small{color:var(--roseInk)}
.st button{width:42px;height:42px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:20px;font-weight:500;line-height:1}
.st .n{text-align:center;line-height:1.15}
.st .n b{display:block;font-size:22px}
.st .n small{font-size:12px;font-weight:700}
/* verdict line */
.verdict{margin:10px 0 0;font-weight:700;font-size:15px;text-align:center;padding:9px;border-radius:var(--r)}
.verdict:empty{display:none}
.verdict small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.verdict.r0,.verdict.r1,.verdict.good{background:var(--green-soft);color:var(--green)}
.verdict.r2{background:var(--blue-soft);color:var(--blue)}
.verdict.r3{background:var(--gold-soft);color:var(--goldInk)}
.verdict.r4,.verdict.bad{background:var(--rose-soft);color:var(--roseInk)}
.lnote{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);margin-top:8px}
.lnote input{padding:9px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);font:inherit;font-size:15px;outline:none}

/* ===== save bar, toast, sheet ===== */
.savebar{position:fixed;left:0;right:0;bottom:var(--navh);z-index:6;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.savebar .in{max-width:560px;margin:0 auto}
.savebar.idle{background:none;pointer-events:none}
.savebar.idle .btn,.savebar.idle .msg{display:none}
.pend{font-size:13px;color:var(--goldInk);text-align:center;margin:0 0 4px;font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--navh) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:8;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:none;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.2);width:max-content;max-width:92vw;font-size:14px}
.toast.show{display:flex;animation:pop .25s}
@keyframes pop{from{transform:translate(-50%,12px);opacity:0}}
.toast button{background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-in{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s}
@keyframes up{from{transform:translateY(30px);opacity:0}}

/* ===== my day (student) ===== */
.myday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px 8px;margin:4px 0 6px}
.myday .mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
.myday .mh b{font-size:15px}.myday .mh small{font-size:12px;color:var(--muted)}
.mprog{margin:8px 0 6px}
.mprog .fbar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin:0}
.mprog .fbar i{display:block;height:100%;background:var(--green);border-radius:3px}
.mprog small{display:block;font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.trow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow .v{flex:1;font-family:var(--quran);font-size:18px;font-weight:700;line-height:1.5}
.trow .v small{display:block;font-family:var(--ui);font-size:12px;font-weight:400;color:var(--muted)}
.trow .st{display:inline;border:0;background:none;padding:0;font-size:13px;white-space:nowrap}
.trow .st.ok{color:var(--green);font-weight:500}.trow .st.no{color:var(--muted)}.trow .st.bad{color:var(--roseInk);font-weight:500}
.planrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 14px;margin:8px 0 12px}
.planrow div{flex:1;min-width:0;font-size:12px;color:var(--muted)}
.planrow b{display:block;font-family:var(--quran);font-size:17px;color:var(--ink)}
.planrow button{flex:none;min-height:36px}
/* my level */
.lvl-btn{display:block;width:100%;min-height:40px;margin:0 0 6px;padding:6px 2px;text-align:start;font-size:14px;font-weight:500;color:var(--green)}
.lvl-x{font-size:12px}
.lvl{--c:var(--green);border-radius:var(--r-lg);padding:14px 16px;margin:10px 0 4px;background:var(--green-soft);color:var(--ink)}
.lvl.t0{background:#1F6B4A;color:#fff}.lvl.t0 .lvl-big,.lvl.t0 .lvl-s b,.lvl.t0 .lvl-h span,.lvl.t0 .lvl-s{color:#fff}
.lvl.t2{--c:var(--blue);background:var(--blue-soft)}.lvl.t3{--c:var(--gold);background:var(--gold-soft)}.lvl.t4{--c:var(--rose);background:var(--rose-soft)}.lvl.t0n{--c:var(--muted);background:var(--surface);border:1px dashed var(--line)}
.lvl-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl-h span{font-size:13px;color:var(--muted)}.lvl-h b{font-size:20px}
.lvl-big{font-size:22px;font-weight:700;margin-top:2px;color:var(--c)}
.lvl.t3 .lvl-big{color:var(--goldInk)}.lvl.t4 .lvl-big{color:var(--roseInk)}
.lvl p{margin:4px 0 8px;font-size:14px}
.lvl-s{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.lvl-s b{color:var(--ink)}
.lvl-last{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lvl-l{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.lvl-days{margin-bottom:6px}
.ld{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ld-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;margin-bottom:6px}
.ld-i{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.ld-r{flex:1;font-family:var(--quran);font-size:17px;font-weight:700}

/* ===== what I recorded today ===== */
.day{font-size:13px;color:var(--muted);margin:18px 4px 8px;font-weight:500}
.rec{position:relative}
.rec .pair{font-weight:700;padding-left:110px}
.rec .pair small{font-weight:400;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:8px;margin-top:8px;border-top:1px solid var(--line)}
.row .k{font-size:12px;color:var(--muted);width:48px}
.row .v{font-family:var(--quran);font-size:17px;font-weight:700;flex:1;min-width:120px}
.del{position:absolute;top:10px;left:8px;width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:18px}
.edt{position:absolute;top:10px;left:46px;color:var(--green)}

/* ===== teacher room ===== */
.room-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.room-head h2{margin:0}
/* list of students, menus */
.slist,.menu,.rank,.att-list,.jlist{list-style:none;margin:0;padding:0}
.slist li,.menu li{display:flex;align-items:center;gap:10px;padding:13px 2px;border-top:1px solid var(--line);cursor:pointer}
.slist li:first-child,.menu li:first-child,.rank li:first-child,.att-list li:first-child,.jlist li:first-child{border-top:0}
.slist .nm2,.menu .mi{flex:1;min-width:0;font-weight:700}
.slist .sub2,.menu .mi small{font-size:12px;color:var(--muted);font-weight:400;display:block}
.slist .chev,.menu .chev{color:var(--muted);font-size:18px;line-height:1}
/* strips: one row per recitation */
.strip{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;position:relative}
.strip .sd{flex:none;width:64px;text-align:center;border-left:1px solid var(--line);padding-left:10px;line-height:1.3}
.strip .sd b{display:block;font-size:12px}
.strip .sd span{font-size:12px;color:var(--muted)}
.strip .sm{flex:1;min-width:0;padding-left:58px}
.strip .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.strip .rg{font-family:var(--quran);font-size:17px;font-weight:700}
.strip .amt2{font-size:12px;color:var(--muted)}
.strip .bot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:12px}
.strip .by{color:var(--muted)}
.strip .x,.strip .ed{position:absolute;top:6px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.strip .x{left:6px;color:var(--muted);font-size:17px}
.strip .ed{left:38px;color:var(--green)}
.strip .ed svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sumline{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
/* pin pad */
.pin{max-width:300px;margin:30px auto 0;text-align:center}
.dots{display:flex;justify-content:center;gap:14px;margin:18px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--green)}
.dots i.on{background:var(--green)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{height:62px;width:62px;margin:0 auto;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:21px;font-weight:500}
.pad button.t{border:0;background:none;font-size:13px;color:var(--muted)}

/* ===== stats, ranking ===== */
.kpis,.tcount{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tcount{margin-bottom:12px}
.kpi,.tcount div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.kpi b,.tcount b{display:block;font-size:19px;line-height:1.3;color:var(--ink)}
.kpi span,.tcount div{font-size:12px;color:var(--muted)}
.rank li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.rank .who{font-weight:700}
.rank .sc{font-weight:700;font-size:15px}
.rank .meta{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.cov{display:flex;flex-direction:row-reverse;gap:1px;height:28px;border-radius:6px;overflow:hidden;direction:ltr}
.cov i{flex:1;background:var(--line)}
.covends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.jlist li{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer}
.jlist .jn{font-weight:700;font-size:13px;white-space:nowrap}
.jn small{font-size:12px}
.jlist .jbar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.jlist .jbar i{display:block;height:100%;background:var(--gold);border-radius:3px;margin-inline-start:0}
.jlist .jt{font-size:12px;color:var(--muted);white-space:nowrap}
.schips{display:flex;flex-wrap:wrap;gap:6px}
.sc2{font-family:var(--quran);font-size:15px;padding:3px 10px;border-radius:var(--r-sm);background:var(--green-soft);color:var(--green)}
.sc2 b{font-family:var(--ui);font-size:12px}
.sc2.none{background:var(--rose-soft);color:var(--roseInk)}

/* ===== attendance ===== */
.att-nav{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.att-nav button{width:40px;height:40px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:14px}
.att-nav button:disabled{opacity:.3}
.att-nav b{font-size:16px}
.attpick{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--muted);margin:-4px 0 12px}
.attpick input{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:14px}
.att-list li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.att-list .nm2{flex:1;min-width:0;font-weight:500}
.att-list .why{font-size:12px;color:var(--muted);display:block;font-weight:400}
.att-list .rate{font-size:12px;color:var(--muted);white-space:nowrap}
.att3{display:flex;flex:none;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.att3 button{font-size:12px;padding:5px 9px;min-height:36px;color:var(--muted);border-inline-start:1px solid var(--line)}
.att3 button:first-child{border-inline-start:0}
.att3 button[aria-pressed="true"][data-s="p"]{background:var(--green-soft);color:var(--green);font-weight:700}
.att3 button[aria-pressed="true"][data-s="e"]{background:var(--gold-soft);color:var(--goldInk);font-weight:700}
.att3 button[aria-pressed="true"][data-s="a"]{background:var(--rose-soft);color:var(--roseInk);font-weight:700}
.att-list.now .att3 button[aria-pressed="true"][data-s="a"]{background:var(--fill);color:var(--muted)}

/* ===== «اليوم»: the halaqa at a glance ===== */
.tdtop{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.tdtop .date{font-size:13px;color:var(--muted)}
.tdtop .big{display:flex;align-items:baseline;gap:8px;margin:2px 0 12px}
.tdtop .big b{font-size:36px;font-weight:700;line-height:1.2;color:var(--ink)}
.tdtop .big span{font-size:14px;color:var(--muted)}
.tseg{display:flex;gap:3px;direction:rtl}
.tseg i{flex:1;height:8px;border-radius:2px;background:var(--fill)}
.tseg i.d{background:var(--green)}.tseg i.p{background:var(--gold)}.tseg i.e{background:repeating-linear-gradient(45deg,var(--line),var(--line) 3px,transparent 3px,transparent 6px)}
.tleg,.fleg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.tleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
.talert{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:start;padding:11px 2px;border-top:1px solid var(--line);font-size:14px;line-height:1.6}
.talert:first-child{border-top:0}
.talert .tag{flex:none;margin-top:2px}
.trw{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.trw.done{background:transparent}
.trw .th{min-height:30px;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:start}
.trw .th b{font-size:15px}
.trw .th small{font-size:12px;color:var(--muted);white-space:nowrap}
.trw .tl{display:flex;align-items:center;gap:8px;margin-top:5px}
.trw .ls{font-family:var(--quran);font-size:15px;color:var(--muted);flex:1;min-width:0;line-height:1.5}
.trw .tp{display:flex;gap:6px;flex:none}
.texc{font-size:13px;color:var(--muted);padding:8px 4px;line-height:1.9}.texc button{font:inherit;color:var(--ink);background:none;border:0;padding:0}
.sp{font-size:13px;padding:6px 11px;min-height:34px;white-space:nowrap;border-radius:8px;border:1px solid transparent;line-height:1.5}
.sp.ok{background:var(--green-soft);color:var(--green);font-weight:500}
.sp.redo{background:var(--rose-soft);color:var(--roseInk);font-weight:500}
.sp.todo{border-color:var(--line);color:var(--ink);background:var(--surface);font-weight:500}
.sp.na{color:var(--muted);opacity:.55}
/* quick lesson verdict */
.qbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 6px}
.qb{padding:16px 8px;border-radius:12px;font-size:17px;font-weight:700}
.qb.ok{background:var(--green);color:var(--onGreen)}
.qb.redo{background:var(--rose-soft);color:var(--roseInk)}
.qb:disabled{opacity:.5}

/* ===== week view ===== */
.wsum{padding:14px}.wrng{font-size:13px;color:var(--muted);text-align:center;margin-bottom:10px}
.wkpi{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:12px;color:var(--muted)}.wkpi b{display:block;font-size:22px;line-height:1.4;color:var(--ink)}
.whead{display:flex;align-items:center;justify-content:space-between;padding:4px 12px;font-size:12px;color:var(--muted)}
.whead .wk i{background:none;border:0;font-style:normal;font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap;height:auto}
.wrow,.wrow2{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.wtop2{display:flex;align-items:center;justify-content:space-between;gap:8px}.wtop2 b{font-size:15px;min-width:0}
.wk{display:flex;gap:4px;flex:none}
.wk i{width:34px;height:28px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;background:var(--fill);color:var(--muted)}
.wk i.w-g,.wleg i.w-g{background:var(--green-soft);color:var(--green)}.wk i.w-r,.wleg i.w-r{background:var(--rose-soft);color:var(--roseInk)}.wk i.w-a,.wleg i.w-a{background:var(--roseInk);color:var(--surface)}
.wk i.w-e,.wleg i.w-e,.wk i.w-h,.wleg i.w-h{background:var(--gold-soft);color:var(--goldInk)}.wk i.w-w{background:transparent;border:1px solid var(--line)}
.wtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.wfine{display:flex;flex-wrap:wrap;gap:6px;padding:10px}
.wfine button{font:inherit;font-size:13px;padding:5px 11px;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.wleg{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:12px;color:var(--muted);margin:10px 0 4px}.wleg span{display:flex;align-items:center;gap:4px}
.wleg i{width:20px;height:18px;border-radius:4px;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}
.wtop{text-align:center;padding:14px}.wtop b{font-size:28px;display:block;line-height:1.3}.wtop b span{font-size:14px;color:var(--muted);font-weight:400}.wtop small{font-size:13px;color:var(--muted)}
.wrow b{display:block;font-size:15px;margin-bottom:4px}
.wrow .wl{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.6;padding:2px 0;color:var(--ink)}.wrow .wl .tag{flex:none;margin-top:2px}

/* ===== student file ===== */
.fpos b{display:block;font-size:14px}
.fpos small{font-size:12px;color:var(--muted)}
.fbar{height:6px;border-radius:3px;background:var(--fill);margin:10px 0 8px;overflow:hidden}
.fbar i{display:block;height:100%;background:var(--green);border-radius:3px}
.bfrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.bfrow span{color:var(--muted)}
.fgrid{display:grid;grid-template-columns:50px repeat(var(--n),minmax(0,1fr));gap:3px;align-items:center}
.fgrid .rl{font-size:12px;color:var(--muted);white-space:nowrap}
.fgrid>button{min-height:26px}
.fgrid button{display:block;width:100%;aspect-ratio:1;border-radius:4px;background:var(--fill);border:1px solid transparent;padding:0}
.fgrid button.d10{background:var(--green);border-color:var(--green)}
.fgrid button.d9{background:var(--green-soft);border-color:var(--green)}
.fgrid button.d8{background:var(--gold);border-color:var(--gold)}
.fgrid button.d0{background:var(--rose);border-color:var(--rose)}
.fgrid button.dn{aspect-ratio:auto;background:none;border:0;font-size:11px;color:var(--muted);padding:2px 0;border-radius:6px;line-height:1.3}
.fgrid button.dn.ab{color:var(--roseInk);font-weight:700}.fgrid button.dn.ex{color:var(--goldInk);font-weight:700}
.fgrid button.dn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fleg{gap:10px}
.fleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:4px;vertical-align:-1px;border:1px solid var(--line)}
.fday{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.fday>b{display:block;font-size:14px;margin-bottom:8px}
.fday .strip{background:var(--bg)}
.fline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.fline:first-child{border-top:0}
.fline small{color:var(--muted);font-size:12px}

/* ===== plans ===== */
.pghead{font-size:13px;color:var(--muted);margin:14px 2px 6px;font-weight:500}
.boxrow{display:block;width:100%;text-align:start;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);margin-bottom:6px;font-size:13px;line-height:1.7}
.boxrow[aria-current="true"]{border-color:var(--green);background:var(--green-soft)}
.boxrow .q{font-family:var(--quran);font-size:16px;font-weight:700}
.boxrow small{display:block;color:var(--muted);font-size:12px}
.pgrp{margin:8px 0}.pgrp>small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.pchoice{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.pchoice button{min-height:38px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.pchoice button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}

/* ===== settings: names, identity ===== */
textarea.roster{width:100%;min-height:260px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:16px;line-height:1.8;outline:none;resize:vertical}
textarea.roster:focus{border-color:var(--green)}
.bprev{width:120px;height:120px;margin:4px auto 10px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:12px;background:var(--bg)}

<script>

const SURAH="الفاتحة البقرة آل_عمران النساء المائدة الأنعام الأعراف الأنفال التوبة يونس هود يوسف الرعد إبراهيم الحجر النحل الإسراء الكهف مريم طه الأنبياء الحج المؤمنون النور الفرقان الشعراء النمل القصص العنكبوت الروم لقمان السجدة الأحزاب سبأ فاطر يس الصافات ص الزمر غافر فصلت الشورى الزخرف الدخان الجاثية الأحقاف محمد الفتح الحجرات ق الذاريات الطور النجم القمر الرحمن الواقعة الحديد المجادلة الحشر الممتحنة الصف الجمعة المنافقون التغابن الطلاق التحريم الملك القلم الحاقة المعارج نوح الجن المزمل المدثر القيامة الإنسان المرسلات النبأ النازعات عبس التكوير الانفطار المطففين الانشقاق البروج الطارق الأعلى الغاشية الفجر البلد الشمس الليل الضحى الشرح التين العلق القدر البينة الزلزلة العاديات القارعة التكاثر العصر الهمزة الفيل قريش الماعون الكوثر الكافرون النصر المسد الإخلاص الفلق الناس".split(" ").map(s=>s.replace("_"," "));
const SP=[1,2,50,77,106,128,151,177,187,208,221,235,249,255,262,267,282,293,305,312,322,332,342,350,359,367,377,385,396,404,411,415,418,428,434,440,446,453,458,467,477,483,489,496,499,502,507,511,515,518,520,523,526,528,531,534,537,542,545,549,551,553,554,556,558,560,562,564,566,568,570,572,574,575,577,578,580,582,583,585,586,587,587,589,590,591,591,592,593,594,595,595,596,596,597,597,598,598,599,599,600,600,601,601,601,602,602,602,603,603,603,604,604,604];
const JUZ_TICKS=[[77,"٣٠"],[66,"٢٩"],[57,"٢٨"],[50,"٢٧"],[45,"٢٦"],[36,"٢٣"],[17,"١٥"]];
const LAST=113, PARTS={near:"القريبة",far:"البعيدة"}, KIND={near:"قريبة",far:"بعيدة"};
const nf=(n,d=0)=>Number(n).toLocaleString("ar-SA",{maximumFractionDigits:d});
const nz=n=>n?nf(n):"صفر";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
const view=$("#view");

/* ---------- helpers ---------- */
function pagesOf(p){if(!p||p.skipped||p.from==null)return 0;const a=Math.min(p.from,p.to),b=Math.max(p.from,p.to);return Math.max(0.3,(b<LAST?SP[b+1]:605)-SP[a])}
const ptsOf=p=>(!p||p.skipped||p.from==null)?0:(p.err||0)+0.5*(p.hes||0);
const recPages=r=>pagesOf(r.near)+pagesOf(r.far);
const recPts=r=>ptsOf(r.near)+ptsOf(r.far);
const juzAmt=p=>(!p||p.skipped||p.from==null)?0:partJuz(p).reduce((s,z)=>s+z.frac,0);
const amtTxt=p=>{const j=juzAmt(p);return j>=0.5?`${nf(j,1)} جزء`:juzTxt(pagesOf(p))};
const juzTxt=pg=>pg>=10?`${nf(pg/20,1)} جزء`:pg<1.5?"صفحة تقريبًا":`${nf(Math.round(pg))} ${Math.round(pg)<=10?"صفحات":"صفحة"}`;
const scoreOf=(pts,pg)=>pg>0?Math.max(0,Math.round(100-25*pts/pg)):null;
function grade(s){if(s==null)return["—","t-na"];if(s>=95)return["ممتاز","t-good"];if(s>=85)return["جيد جدًا","t-good"];if(s>=75)return["جيد","t-mid"];return["يحتاج مراجعة","t-bad"]}

const pad2=n=>String(n).padStart(2,"0");
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())};
const today=()=>dayKey(Date.now());
/* recording for yesterday: a student who forgot can record the next day */
let recDayMode="t";
const yKey=()=>dayKey(Date.now()-864e5);

const recAt=()=>recDayMode==="y"?Date.now()-864e5:Date.now();

const dayPick=()=>F.editId?"":`<div class="dayseg" id="rday"><button data-dm="t" aria-pressed="${recDayMode==="t"}">اليوم</button><button data-dm="y" aria-pressed="${recDayMode==="y"}">أمس (${new Date(Date.now()-864e5).toLocaleDateString("ar-SA",{weekday:"long"})})</button></div>`;
function hashName(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)>>>0}return h.toString(36)}
const lockId=(reader,part,day=dayOf())=>`${day}_${hashName(reader)}_${part}`;
function disp(full){
  if(!full||full==="المعلم")return full;
  const cut=n=>n.split(/\s+/).filter(x=>x&&x!=="بن");

  for(const[d,m]of Object.entries(D))Object.entries(m).map(([n,o])=>{const per=o.pts/Math.max(o.jz,0.25);return{n,per,jz:o.jz,t:o.pts===0?0:per<=2?1:per<=4?2:per<=6?3:4}})

function bindAdd(){

/* an exam by the manhaj's rules: 3 questions per juz (+1 for the last one); an error or a لحن costs a mark, a hesitation half;
   in the first exams (جزء النبأ والملك) the cost is doubled; above 30 questions it is halved; 90٪ passes */

  const close=()=>el.remove();
  const calc=()=>{const q=3*E.juz+1,w=E.juz<=2?2:q>30?0.5:1,score=Math.max(0,100-(E.err*w+E.hes*w/2));return{q,w,score:Math.round(score*10)/10,pass:score>=90}};
  const st=(k,label,cls)=>`<div class="st ${cls}"><button data-e="${k}:-1" aria-label="أنقص">−</button><div class="n"><b data-ev="${k}"></b><small>${label}</small></div><button data-e="${k}:1" aria-label="زد">+</button></div>`;
  el.innerHTML=`<div class="sheet-bg" data-close></div><div class="sheet-in" role="dialog" aria-label="اختبار ${esc(disp(n))}">

    <p class="lead" style="font-size:13px">يُختبر الطالب في محفوظه كله بعد كل استمارة ضبط.</p>
    <div class="steppers" style="grid-template-columns:1fr">${st("juz","عدد الأجزاء المختبَرة","h")}</div>
    <div class="steppers" style="margin-top:8px">${st("hes","تردد","h")}${st("err","خطأ أو لحن","e")}</div>
    <p class="verdict" data-ex></p><p class="msg" data-msg></p>
    <button class="btn" data-save>احفظ الاختبار</button></div>`;
  const paint=()=>{const c=calc();for(const k of["juz","err","hes"])el.querySelector(`[data-ev="${k}"]`).textContent=nf(E[k]);
    const v=el.querySelector("[data-ex]");v.className="verdict "+(c.pass?"good":"bad");
    v.innerHTML=`${c.pass?"✓ اجتاز":"✗ لم يجتز"} · ${nf(c.score)}٪ <small>${nf(c.q)} سؤالًا · الخطأ ${nf(c.w)} والتردد ${nf(c.w/2)} · النجاح من ٩٠٪</small>`};

  el.querySelector("[data-save]").onclick=async()=>{const c=calc(),b=el.querySelector("[data-save]"),pl=planOf(n),sur=pl&&(pl.box[3]||pl.box[2])?(pl.box[3]||pl.box[2])[2]:113;
    const rec={id:Date.now()+"-"+Math.random().toString(36).slice(2,6),day:today(),at:Date.now(),student:n,from:sur,to:113,
      note:`اختبار · ${E.juz===1?"جزء واحد":E.juz===2?"جزآن":nf(E.juz)+(E.juz<11?" أجزاء":" جزءًا")} · ${nf(c.score)}٪`,hes:E.hes,err:E.err,verdict:c.pass?"pass":"redo"};
    b.disabled=true;
    try{const r=await api("saveLesson",pin||tpin,rec);if(!r||!r.ok)throw 0}catch(e){b.disabled=false;el.querySelector("[data-msg]").textContent="تعذّر الحفظ، تأكد من الاتصال";return}
    pushLessonEvt(rec);lessons.push(rec);close();if(room&&unlocked)renderRoom();toast(`حُفظ الاختبار: ${nf(c.score)}٪ ${c.pass?"✓":""}`)};
  paint();
}
function renderJuz(rv){

  if(!o){rv.innerHTML=head+`<p class="empty">لم يقرأ هذا الجزء في هذه الفترة.</p>`;bindJ();return}

  // which surahs of this juz were covered and how often
  const sur=[];for(let i=0;i<=LAST;i++){const s=SP[i],e=i<LAST?Math.max(SP[i+1],s+0.3):605;if(Math.min(e,JE(k))-Math.max(s,JS(k))>0)sur.push(i)}
  const cnt=Object.fromEntries(sur.map(i=>[i,0]));
  for(const x of o.items){const a=Math.min(x.p.from,x.p.to),b=Math.max(x.p.from,x.p.to);for(const i of sur)if(i>=a&&i<=b)cnt[i]++}

/* ranking: reader quality + listener alertness */
function computeStats(rs){
  const R={},L={},pair={};let pg=0,pts=0;
  const add=(o,k,g,p)=>{(o[k]??={n:0,pg:0,pts:0});o[k].n++;o[k].pg+=g;o[k].pts+=p};
  const RB={};
  for(const r of rs){const g=recPages(r),p=recPts(r);if(!g)continue;add(R,r.reader,g,p);
    if(r.listener===r.reader)continue; /* self-recitation: not used to judge listeners */
    pg+=g;pts+=p;add(RB,r.reader,g,p);add(L,r.listener,g,p);
    const k=r.reader+"\u0001"+r.listener;(pair[k]??={pg:0,pts:0});pair[k].pg+=g;pair[k].pts+=p}
  for(const[name,l]of Object.entries(L)){let obs=0,exp=0;
    for(const[k,v]of Object.entries(pair)){const[rd,ls]=k.split("\u0001");if(ls!==name)continue;
      const tot=RB[rd],oPg=tot.pg-v.pg,oPts=tot.pts-v.pts;let rate;
      if(oPg>=10)rate=oPts/oPg;else{const gPg=pg-l.pg;rate=gPg>=10?(pts-l.pts)/gPg:null}
      if(rate!=null){obs+=v.pts;exp+=rate*v.pg}}
    l.idx=(l.n>=3&&exp>=1)?obs/exp:null}
  return{R,L};
}
function alertTag(i){if(i==null)return["بيانات قليلة","t-na"];if(i>=0.85)return["يقظ","t-good"];if(i>=0.5)return["متوسط","t-mid"];return["قد يكون متساهلًا","t-bad"]}

function renderListen(rv){

/* ما سمعه الطالب لغيره في الفترة المختارة */
const mrTxt=n=>n===1?"مرة واحدة":n===2?"مرتين":nf(n)+(n>=3&&n<=10?" مرات":" مرة");
const caughtTx=(h,e)=>h||e?`${h?`<span class="pill h">تردد ${nf(h)}</span>`:""}${e?`<span class="pill e">خطأ ${nf(e)}</span>`:""}`:`<span class="tag t-na">لم يرصد شيئًا</span>`;
function listenOf(n,rs){
  const parts=[];
  for(const r of rs)if(r.listener===n&&r.reader!==n)for(const k of["near","far"]){const p=r[k];if(p&&!p.skipped&&p.from!=null)parts.push({r,k,p})}
  parts.sort((a,b)=>b.r.at-a.r.at);
  const by={};
  for(const x of parts){const o=(by[x.r.reader]??={n:0,hes:0,err:0});o.n++;o.hes+=x.p.hes||0;o.err+=x.p.err||0}
  return{parts,hes:parts.reduce((a,x)=>a+(x.p.hes||0),0),err:parts.reduce((a,x)=>a+(x.p.err||0),0),
    by:Object.entries(by).map(([rd,o])=>({rd,...o})).sort((a,b)=>b.n-a.n)};
}
/* تقرير السماع لطالب واحد */
function openListener(n){
  const rs=rankRecs(),L=listenOf(n,rs),st=computeStats(rs).L[n],[g,c]=alertTag(st?st.idx:null);

  const fmt=t=>new Date(t).toLocaleDateString("ar-SA",{weekday:"long",day:"numeric",month:"long"});
  const el=document.createElement("div");el.className="sheet";
  el.innerHTML=`<div class="sheet-bg" data-close></div><div class="sheet-in" role="dialog" aria-label="تقرير السماع">
    <div class="ph"><b>${esc(disp(n))}</b><button class="lvl-x" data-close>إغلاق</button></div>

/* ---------- «اليوم»: the whole halaqa at a glance ----------
   for every student: today's box, and whether the lesson / near / far are done, to redo, or still due */
function todayState(n){
  const td=today(),pl=planOf(n),B=pl?pl.box:null,st={};
  const les=lessons.filter(l=>l.student===n&&l.day===td&&!isExam(l)),L=les[les.length-1];
  st.lesson=L?(L.verdict==="redo"?"redo":"ok"):(B&&B[2]?"todo":"na");
  for(const[k,ix]of[["near",3],["far",4]]){
    const rs=records.filter(r=>r.reader===n&&dayKey(r.at)===td&&r[k]&&!r[k].skipped&&r[k].from!=null),r=rs[rs.length-1];
    st[k]=r?(rateOf(r[k])===4?"redo":"ok"):((B?B[ix]:true)?"todo":"na")}
  const keys=["lesson","near","far"],todo=keys.filter(k=>st[k]==="todo"),redo=keys.filter(k=>st[k]==="redo"),any=keys.some(k=>st[k]==="ok"||st[k]==="redo");
  return{n,pl,st,todo,redo,any,exc:!any&&isExc(td,n),done:!todo.length};
}
const TPART={lesson:"الدرس",near:"القريبة",far:"البعيدة"};
const daysTxt=k=>k===1?"يوم":k===2?"يومين":k<11?nf(k)+" أيام":nf(k)+" يومًا";
function todayAlerts(S){
  const A=[],td=today();
  const CURE={lesson:"السبب الدرس: علّمه طريقة التحضير، أو أنزل مساره",near:"السبب القريبة: يعيد حفظها بدرس أطول",far:"السبب البعيدة: يُضبط محفوظه بتمام البنيان",miss:"لم يُسمَّع مقرره كاملًا"};
  for(const x of S)if(x.redo.length)A.push({n:x.n,c:"t-bad",t:"يُعاد",m:`${disp(x.n)}: أُعيد ${x.redo.map(k=>TPART[k]).join(" و")}، فيعيد مقرر اليوم كاملًا غدًا`});
  for(const x of S)if(x.pl&&x.pl.run&&x.pl.run.k===x.pl.run.n)A.push({n:x.n,c:"t-good",t:"اختبار",m:`${disp(x.n)} في آخر يوم من استمارة الضبط: يُختبر بعدها في محفوظه`});
  const past=[...halaqaDays()].filter(d=>d<td).sort().reverse();
  for(const x of S){let k=0;for(const d of past){if(attendedOn(x.n,d)||isExc(d,x.n))break;k++}
    if(k>=2&&!x.any)A.push({n:x.n,c:"t-bad",t:"غائب",m:`${disp(x.n)} لم يحضر آخر ${daysTxt(k)}`});
    /* back after a break: the manhaj's rule by its length */
    if(x.any){const last=past.find(d=>attendedOn(x.n,d));
      if(last){const gap=Math.round((tOfDay(td)-tOfDay(last))/864e5);
        if(gap>=10)A.push({n:x.n,c:"t-mid",t:"عائد",m:`${disp(x.n)} عاد بعد ${daysTxt(gap)}: ${gap<=25?"يعيد مقرر آخر يومين ثم يكمل":gap<=50?"يعيد دورة بعيدة كاملة قبل الدرس الجديد":"يُختبر في كامل محفوظه"}`})}}}
  return A;
}

/* ---------- this week: each student's stumbles day by day, worst first ---------- */
function weekData(){
  const td=today(),D=864e5,hd=halaqaDays(),days=[];
  for(let k=6;k>=0;k--){const d=dayKey(Date.now()-k*D);if(!offDay(d)&&(hd.has(d)||d===td))days.push(d)}
  const rows=roster.map(n=>{const pl=planOf(n),c={ab:0,ex:0,les:0,near:0,far:0,nol:0},cells=[];
    for(const d of days){
      const recs=dayIdx().byRD.get(n+"|"+d)||[],les=lessons.filter(l=>l.student===n&&l.day===d&&!isExam(l));
      const pr=recs.flatMap(partsOf),bad=[];
      if(les.some(l=>l.verdict==="redo")){c.les++;bad.push("الدرس")}
      if(pr.some(x=>x.k==="near"&&rateOf(x.p)===4)){c.near++;bad.push("القريبة")}
      if(pr.some(x=>x.k==="far"&&rateOf(x.p)===4)){c.far++;bad.push("البعيدة")}
      const here=attendedOn(n,d),ex=!here&&isExc(d,n);
      let st;
      if(ex){c.ex++;st="e"}
      else if(!here){if(d<td){c.ab++;st="a"}else st="w"}
      else if(bad.length)st="r";
      else{if(d<td&&pl&&pl.box&&pl.box[2]&&!pl.stop&&!les.length){c.nol++;st="h"}else st="g"}
      cells.push({d,st,bad})}
    const stuck=pl&&pl.stay>=3?pl.stay:0;
    const score=c.ab*3+c.les*3+c.near*2+c.far*2+c.nol+c.ex+(stuck?2:0);
    return{n,pl,c,cells,stuck,score}});
  rows.sort((a,b)=>b.score-a.score||a.n.localeCompare(b.n,"ar"));
  return{days,rows};
}

/* ---------- fill in the missing lessons: days with a near/far review but no lesson get the lesson of that day's box ---------- */
/* shared pure logic: infer each day's box for a student and the lesson that is missing */
function backfillFor(P,A,days,adKey){
  // P: plan boxes array, A:{b}, days: [{d, near:[{from,to}], far:[...], les:[{verdict}]}] sorted asc (only days < today)
  const same=(r,b)=>b&&r&&((r.from===b[0]&&r.to===b[2])||(r.from===b[2]&&r.to===b[0]));
  const cands=o=>{const c=[];P.forEach((B,i)=>{if((!o.near.length||o.near.some(r=>same(r,B[3])))&&(!o.far.length||o.far.some(r=>same(r,B[4])))&&(o.near.length||o.far.length))c.push(i)});return c};
  const out=[],bad=[];
  const post=days.filter(x=>x.d>=adKey),pre=days.filter(x=>x.d<adKey).reverse();
  let i=A.b;
  for(const o of post){const c=cands(o),redo=o.les.some(l=>l.verdict==="redo");
    let pick=c.includes(i)?i:c.includes(i+1)?i+1:-1;
    if(pick<0){bad.push(o.d);continue}
    out.push({d:o.d,i:pick,has:o.les.length>0});i=redo?pick:Math.min(pick+1,P.length-1)}
  let prev=A.b;
  for(const o of pre){const c=cands(o),redo=o.les.some(l=>l.verdict==="redo");
    let pick=-1;
    if(redo&&c.includes(prev))pick=prev;
    else if(c.includes(prev-1))pick=prev-1;
    else if(c.includes(prev))pick=prev;
    if(pick<0){bad.push(o.d);continue}
    out.push({d:o.d,i:pick,has:o.les.length>0});prev=pick}
  return{out:out.sort((a,b)=>a.d<b.d?-1:1),bad:bad.sort()};
}

const BF_UNTIL="2026-11-16";
function backfillScan(){
  const td=today()<BF_UNTIL?today():BF_UNTIL,rows=[];
  for(const n of roster){const k=planKey(n);if(!k)continue;const A=planA[k],P=PLANS[A.p];if(!P)continue;
    if(A.stop||lessons.some(l=>l.student===n&&String(l.id).startsWith("bf-")))continue;
    const by={};
    for(const r of records){if(r.reader!==n)continue;const d=dayKey(r.at);if(d>=td)continue;
      for(const x of["near","far"])if(r[x]&&!r[x].skipped&&r[x].from!=null)(by[d]??={d,near:[],far:[],les:[]})[x].push(r[x])}
    for(const l of lessons)if(l.student===n&&l.day<td&&!isExam(l))(by[l.day]??={d:l.day,near:[],far:[],les:[]}).les.push(l);
    const days=Object.values(by).sort((a,b)=>a.d<b.d?-1:1);if(!days.length)continue;
    const res=backfillFor(P.d,{b:Math.max(0,Math.min(A.b,P.d.length-1))},days,dayKey(A.at));
    const adds=res.out.filter(x=>!x.has&&P.d[x.i][2]&&!lessons.some(l=>l.id==="bf-"+x.d+"-"+n)).map(x=>({d:x.d,i:x.i,pid:A.p,box:P.d[x.i]}));
    rows.push({n,adds,ok:res.out.length,bad:res.bad.length,days:days.length})}
  return rows;
}

  <div class="card" id="links"><p class="empty" style="padding:10px">جارٍ التجهيز…</p></div>`;
  (async()=>{
    appUrl=SITE;
    const box=$("#links");if(!box)return;
    if(!appUrl){box.innerHTML=`<p class="empty" style="padding:10px">تعذّر جلب رابط الدفتر</p>`;return}
    const link=n=>`${appUrl}?s=${hashName(n)}`;
    box.innerHTML=`<button class="btn line" id="copyAll" style="margin-bottom:10px">انسخ كل الروابط (لرسالة واتساب)</button>
      <ul class="att-list">${roster.map(n=>`<li><span class="nm2">${esc(disp(n))}</span><button class="excb undo2" data-cp="${esc(n)}">نسخ</button></li>`).join("")}</ul>`;
    const cp=async(t,b)=>{if(await copyText(t))b.textContent="نُسخ ✓"};
    $("#copyAll").onclick=e=>cp(roster.map(n=>`${disp(n)}:\n${link(n)}`).join("\n\n"),e.target);
    box.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>cp(link(b.dataset.cp),b));
  })();
  $("#rs").onclick=async()=>{
    const names=[...new Set($("#rt").value.split(/\n|،|,/).map(s=>s.trim()).filter(Boolean))];
    try{const r=await api("setRoster",pin,names);if(!r||!r.ok){$("#ok").textContent="اكتب اسمًا واحدًا على الأقل";return}roster=abc(names);$("#ok").textContent=`حُفظت ${nf(names.length)} أسماء ✓`}catch{$("#ok").textContent="تعذّر الحفظ"}
  };
  $("#rp").onclick=()=>{changingPin=true;pinStage="enter";pinBuf="";unlocked=false;renderRoom()};
}

/* ---------- notifications (Web Push): this device subscribes, the server sends ---------- */
const PUSH_OK="serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const STANDALONE=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
let swReg=null,pushSub=null,pushBusy=false,pushSyncAt=0,vapid=lsGet("tasmee-vapid","");
const b64bytes=s=>{const r=atob((s+"===".slice((s.length+3)%4)).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(r,c=>c.charCodeAt(0))};
function pushState(){
  if(!PUSH_OK)return IOS&&!STANDALONE?"ios":"none";
  if(Notification.permission==="denied")return"denied";
  return pushSub&&Notification.permission==="granted"?"on":"off";
}
/* keep the server in step with this device: its subscription and whose device it is */
async function pushSync(){
  if(!PUSH_OK||!API)return;
  pushSyncAt=Date.now();
  try{swReg=await navigator.serviceWorker.ready;pushSub=await swReg.pushManager.getSubscription()}catch(e){}
  if(!vapid||lsGet("tasmee-vapid-at","")!==today()){
    try{const r=await api("pushKey");if(r&&r.key){
      if(vapid&&vapid!==r.key&&pushSub){try{await pushSub.unsubscribe()}catch(e){}pushSub=null;lsSet("tasmee-push","")}
      vapid=r.key;lsSet("tasmee-vapid",vapid);lsSet("tasmee-vapid-at",today())}}catch(e){}}
  if(pushSub&&me){const sig=pushSub.endpoint+"|"+me;
    if(lsGet("tasmee-push","")!==sig){try{const r=await api("pushSub",me,pushSub.toJSON(),SITE);if(r&&r.ok)lsSet("tasmee-push",sig)}catch(e){}}}
  paintPush();
}
async function pushEnable(){
  if(pushBusy||!PUSH_OK)return;
  if(!vapid||!swReg)return toast("لحظة، جارٍ التجهيز. حاول بعد ثوانٍ");
  pushBusy=true;paintPush();
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){toast(perm==="denied"?"الإشعارات محظورة. اسمح بها من إعدادات المتصفح":"لم تُفعَّل الإشعارات");return}
    const opt={userVisibleOnly:true,applicationServerKey:b64bytes(vapid)};
    try{pushSub=await swReg.pushManager.subscribe(opt)}
    catch(e){const old=await swReg.pushManager.getSubscription();if(old)await old.unsubscribe();pushSub=await swReg.pushManager.subscribe(opt)}
    const r=await api("pushSub",me,pushSub.toJSON(),SITE);if(!r||!r.ok)throw 0;
    lsSet("tasmee-push",pushSub.endpoint+"|"+me);
    toast("فُعّلت الإشعارات ✓");api("pushTest",pushSub.endpoint).catch(()=>{});
  }catch(e){toast("تعذّر تفعيل الإشعارات، حاول مرة ثانية")}
  finally{pushBusy=false;paintPush()}
}
function pushCard(){
  const st=pushState(),x=`<button class="pb-x" data-push="x" aria-label="إخفاء">×</button>`;
  if(st==="off")return `<div class="pushbar"><div><b>فعّل الإشعارات</b><small>${me==="المعلم"?"لتجرّب وصول الإشعارات على جوالك.":"يصلك تذكير التسميع ونتيجتك ورسائل المعلم."}</small></div><button class="pb-on" data-push="on" ${pushBusy?"disabled":""}>${pushBusy?"…":"تفعيل"}</button>${x}</div>`;
  if(st==="ios")return `<div class="pushbar"><div><b>لتصلك الإشعارات على الآيفون</b><small>افتح هذه الصفحة في Safari، اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»، وافتح الدفتر من أيقونته.</small></div>${x}</div>`;
  if(st==="denied")return `<div class="pushbar"><div><b>الإشعارات محظورة</b><small>اسمح بها لهذا الموقع من إعدادات المتصفح، ثم أعد فتح الدفتر.</small></div>${x}</div>`;
  return"";
}
function paintPush(){
  const el=$("#pushbar");if(!el)return;
  const always=el.dataset.always==="1",hidden=Date.now()-lsGet("tasmee-pushx",0)<7*864e5,st=pushState();
  el.innerHTML=!me||(!always&&hidden)?"":pushCard()||(always?`<div class="locked" style="margin:2px 2px 10px"><i>${st==="on"?"✓":"–"}</i><span>${st==="on"?"الإشعارات مفعّلة على هذا الجوال":"هذا المتصفح لا يدعم الإشعارات"}</span></div>`:"");
  if(always)el.querySelectorAll(".pb-x").forEach(b=>b.remove());
  el.querySelectorAll("[data-push]").forEach(b=>b.onclick=()=>{if(b.dataset.push==="x"){lsSet("tasmee-pushx",Date.now());paintPush()}else pushEnable()});
  const t=$("#ptest");if(t)t.hidden=st!=="on";
  if(pushSub&&me&&lsGet("tasmee-push","")!==pushSub.endpoint+"|"+me&&Date.now()-pushSyncAt>15000)pushSync();
}
/* what happened → a notification for the student it concerns (the server decides whether results are on) */
function pushRecitedEvt(rec){
  if(!API||rec.reader===rec.listener)return;
  const rates={};for(const k of["near","far"])if(rec[k]&&!rec[k].skipped&&rec[k].from!=null)rates[k]=rateOf(rec[k]);
  api("pushRecited",{id:rec.id,reader:rec.reader,listener:rec.listener},rates,disp(rec.listener)).catch(()=>{});
}
function pushLessonEvt(rec){
  const redo=rec.verdict==="redo",what=rec.from===rec.to?`سورة ${SURAH[rec.from]}`:`${SURAH[rec.from]} — ${SURAH[rec.to]}`;
  const body=isExam(rec)?`${rec.note}: ${redo?"لم تجتز. راجع وأعد المحاولة.":"اجتزت، بارك الله فيك."}`:`${what}: ${redo?"يُعاد. راجعه جيدًا وسمّعه من جديد.":"اجتزت، بارك الله فيك."}`;
  api("pushSend",pin||tpin,[rec.student],isExam(rec)?"نتيجة الاختبار":"نتيجة الدرس",body,"result").catch(()=>{});
}
/* teacher: «المزيد ← الإشعارات» */
let pushInfoC=null,pushSchedC=null;
const SDN=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const t12=t=>{const[h,m]=t.split(":").map(Number);return`${nf(h%12||12)}:${nf(Math.floor(m/10))}${nf(m%10)} ${h<12?"صباحًا":"مساءً"}`};
const daysTx=d=>{const s=[...d].sort((a,b)=>a-b);return s.length===7?"كل يوم":s.join()==="0,1,2,3,4"?"من الأحد إلى الخميس":s.map(i=>SDN[i]).join("، ")};
function renderPush(rv){
  const I=pushInfoC,again=()=>{if(room&&unlocked&&rtab==="push")renderRoom()};
  if(!I){rv.innerHTML=`<p class="empty">جارٍ التحميل…</p>`;
    api("pushInfo",pin).then(r=>{pushInfoC=r&&r.ok?r:{err:1};again()}).catch(()=>{pushInfoC={err:1};again()});return}
  if(pushSchedC===null&&!I.err){pushSchedC=false;
    api("pushSchedGet",pin).then(r=>{pushSchedC=r&&r.ok?r:{err:1};again()}).catch(()=>{pushSchedC={err:1};again()})}
  if(I.err){rv.innerHTML=`<div class="card"><b>الإشعارات غير مفعّلة في الخادم</b><p class="lead" style="font-size:14px">أضف ملف Push.gs إلى مشروع Apps Script، شغّل الدالة pushSetup مرة واحدة، ثم انشر إصدارًا جديدًا.</p><button class="btn line" id="pre" style="margin-top:8px">أعد المحاولة</button></div>`;
    $("#pre").onclick=()=>{pushInfoC=null;renderRoom()};return}
  const on=new Set(I.names),have=roster.filter(n=>on.has(n)),miss=roster.filter(n=>!on.has(n)),C=I.cfg;
  /* the daily reminder needs its hourly trigger: create it quietly the first time */
  if(C.remind&&!I.trigger&&!I.tried){I.tried=true;api("pushCfgSet",pin,C).then(r=>{if(r&&r.trigger){I.trigger=true;again()}}).catch(()=>{})}
  const hours=[...Array(18)].map((_,i)=>i+6).map(h=>`<option value="${h}" ${h===C.hour?"selected":""}>${nf(h%12||12)} ${h<12?"صباحًا":"مساءً"}</option>`).join("");
  rv.innerHTML=`
  <div class="card"><b>رسالة للطلاب</b>
    <label class="fld">إلى<select id="pto"><option value="*">كل من فعّل الإشعارات (${nf(have.length)})</option>${have.map(n=>`<option value="${esc(n)}">${esc(disp(n))}</option>`).join("")}</select></label>
    <label class="fld">نص الرسالة<textarea id="pmsg" rows="3" maxlength="300" placeholder="مثال: حلقة اليوم بعد صلاة العصر مباشرة"></textarea></label>
    <p class="okmsg" id="pok"></p><button class="btn" id="psend" style="margin-top:10px">أرسل الإشعار</button></div>
  <div class="card"><b>رسائل مجدولة</b><small class="sch-sub">تُرسل تلقائيًا لكل من فعّل الإشعارات، في الأيام والوقت الذي تختاره${pushSchedC&&pushSchedC.tz&&pushSchedC.tz!=="Asia/Riyadh"?` (بتوقيت ${esc(pushSchedC.tz)})`:""}</small>
    ${!pushSchedC?`<p class="lead" style="font-size:13px;margin:8px 0 0">جارٍ التحميل…</p>`:pushSchedC.err?`<p class="msg" style="text-align:start;margin-top:8px">تعذّر تحميل الرسائل المجدولة. حدّث ملف Push.gs وانشر إصدارًا جديدًا.</p>`:`
    ${pushSchedC.list.length?`<div style="margin-top:6px">${pushSchedC.list.map(s=>`<div class="ls-row"><span style="flex:1;min-width:0"><span class="sch-body">${esc(s.body)}</span><small class="sch-when">${t12(s.time)} · ${daysTx(s.days)}${s.on?"":" · موقوفة"}</small></span><input type="checkbox" class="sch-on" data-son="${esc(s.id)}" ${s.on?"checked":""} aria-label="تشغيل الرسالة"><button class="lvl-x" data-sdel="${esc(s.id)}">حذف</button></div>`).join("")}</div>`:""}
    <label class="fld">نص الرسالة<textarea id="psb" rows="2" maxlength="300" placeholder="مثال: لا تنسَ مراجعة البعيدة قبل النوم"></textarea></label>
    <label class="fld">الوقت<input type="time" id="pst" value="17:00"></label>
    <div class="sdays" id="psd">${SDN.map((d,i)=>`<button data-sd="${i}" aria-pressed="true">${d}</button>`).join("")}</div>
    <p class="msg" id="psm" style="text-align:start"></p>
    <button class="btn line" id="psadd">أضف الرسالة المجدولة</button>`}</div>
  <div class="card"><b>الإشعارات التلقائية</b>
    <label class="swrow"><span>تذكير يومي لمن لم يسمّع<small>من الأحد إلى الخميس</small></span><input type="checkbox" id="prem" ${C.remind?"checked":""}></label>
    <label class="swrow"><span>وقت التذكير</span><select id="phour">${hours}</select></label>
    <label class="swrow"><span>نتيجة الدرس والتسميع<small>تصل للطالب فور تسجيلها</small></span><input type="checkbox" id="pres" ${C.results?"checked":""}></label>
    ${C.remind&&!I.trigger&&I.tried?`<p class="msg" id="ptrig" style="text-align:start;margin-top:8px">التذكير اليومي يحتاج تشغيل الدالة pushSetup مرة واحدة من محرر Apps Script.</p>`:""}
    <p class="okmsg" id="pcok"></p>
    <button class="btn line" id="pnow" style="margin-top:6px">أرسل تذكير التسميع الآن</button></div>
  <div class="lbl">من فعّل الإشعارات · ${nf(have.length)} من ${nf(roster.length)}</div>
  <div class="card"><p class="lead" style="font-size:14px;margin:0">${!roster.length?"لا يوجد طلاب بعد.":miss.length?`لم يفعّلوا بعد: ${miss.map(n=>esc(disp(n))).join("، ")}`:"كل الطلاب فعّلوا الإشعارات."}</p></div>
  <div class="lbl">هذا الجوال</div>
  <div id="pushbar" data-always="1"></div>
  <button class="btn line" id="ptest" hidden>جرّب إشعارًا على هذا الجوال</button>`;
  paintPush();
  $("#psend").onclick=async e=>{
    const b=e.target,m=$("#pok"),text=$("#pmsg").value.trim(),to=$("#pto").value;
    if(!text)return m.textContent="اكتب نص الرسالة";
    b.disabled=true;m.textContent="جارٍ الإرسال…";
    try{const r=await api("pushSend",pin,to==="*"?"*":[to],"رسالة من المعلم",text,"msg");
      if(r&&r.sent){$("#pmsg").value="";m.textContent=`أُرسلت إلى ${nf(r.sent)} ${r.sent>10?"جهازًا":r.sent>2?"أجهزة":r.sent===2?"جهازين":"جهاز واحد"} ✓`}
      else m.textContent="لم تصل لأحد: لا يوجد من فعّل الإشعارات بعد"}
    catch(err){m.textContent="تعذّر الإرسال، تأكد من الاتصال"}
    b.disabled=false};
  const saveCfg=async()=>{const m=$("#pcok");m.textContent="";
    try{const r=await api("pushCfgSet",pin,{remind:$("#prem").checked,hour:+$("#phour").value,results:$("#pres").checked});
      if(!r||!r.ok)throw 0;I.cfg={remind:$("#prem").checked,hour:+$("#phour").value,results:$("#pres").checked};I.trigger=!!r.trigger;
      if(I.cfg.remind&&!I.trigger)return renderRoom();if($("#pcok"))$("#pcok").textContent="حُفظ ✓"}
    catch(err){m.textContent="تعذّر الحفظ"}};
  for(const id of["#prem","#phour","#pres"])$(id).onchange=saveCfg;
  $("#pnow").onclick=async e=>{
    if(!confirm("إرسال تذكير الآن لكل من لم يُسجَّل له تسميع اليوم؟"))return;
    const b=e.target,m=$("#pcok");b.disabled=true;
    try{const r=await api("pushRemindNow",pin);m.textContent=r&&r.sent?`أُرسل التذكير إلى ${nf(r.sent)} ✓`:"لا أحد يحتاج تذكيرًا الآن، أو لم يفعّلوا الإشعارات"}
    catch(err){m.textContent="تعذّر الإرسال"}
    b.disabled=false};
  $("#ptest").onclick=async()=>{try{await api("pushTest",pushSub.endpoint);toast("أُرسل، يصلك خلال ثوانٍ")}catch(e){toast("تعذّر الإرسال")}};
  /* الرسائل المجدولة */
  const S=pushSchedC;if(!S||S.err)return;
  const saveSched=async(list,okTxt)=>{const m=$("#psm");if(m){m.className="msg";m.textContent="جارٍ الحفظ…"}
    try{const r=await api("pushSchedSet",pin,list);if(!r||!r.ok)throw 0;pushSchedC={ok:true,list:r.list,tz:S.tz};again();
      const m2=$("#psm");if(m2){m2.className="okmsg";m2.textContent=okTxt}}
    catch(e){const m2=$("#psm");if(m2){m2.className="msg";m2.textContent="تعذّر الحفظ، تأكد من الاتصال"}}};
  rv.querySelectorAll("[data-sd]").forEach(b=>b.onclick=()=>b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true")));
  $("#psadd").onclick=()=>{const body=$("#psb").value.trim(),time=$("#pst").value,m=$("#psm"),
      days=[...rv.querySelectorAll('[data-sd][aria-pressed="true"]')].map(b=>+b.dataset.sd);
    m.className="msg";
    if(!body)return m.textContent="اكتب نص الرسالة";
    if(!/^\d{2}:\d{2}$/.test(time))return m.textContent="اختر الوقت";
    if(!days.length)return m.textContent="اختر يومًا واحدًا على الأقل";
    saveSched([...S.list,{body,time,days,on:true}],"أُضيفت الرسالة ✓")};
  rv.querySelectorAll("[data-son]").forEach(c=>c.onchange=()=>saveSched(S.list.map(s=>s.id===c.dataset.son?{...s,on:c.checked}:s),c.checked?"شُغّلت ✓":"أُوقفت ✓"));
  rv.querySelectorAll("[data-sdel]").forEach(b=>b.onclick=()=>{if(confirm("حذف هذه الرسالة المجدولة؟"))saveSched(S.list.filter(s=>s.id!==b.dataset.sdel),"حُذفت ✓")});
}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").then(pushSync).catch(()=>{});
render();
window.__booted=true;
</script>
